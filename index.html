<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Sistema Maestro-Detalle de Devoluciones - Secretaría de Movilidad">

  <title>DEVOLUCIÓN DE TRÁMITES</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;

      --success: #10b981;
      --success-light: #d1fae5;
      --success-dark: #065f46;

      --danger: #ef4444;
      --danger-light: #fee2e2;
      --danger-dark: #991b1b;

      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-sm:
        0 1px 2px 0 rgba(0,0,0,0.05);

      --shadow-md:
        0 4px 6px -1px rgba(0,0,0,0.08),
        0 2px 4px -2px rgba(0,0,0,0.05);

      --shadow-lg:
        0 10px 15px -3px rgba(0,0,0,0.08),
        0 4px 6px -4px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter',
                   -apple-system,
                   BlinkMacSystemFont,
                   sans-serif;

      background:
        linear-gradient(
          135deg,
          #f0f4f8 0%,
          #e4ecf7 100%
        );

      min-height: 100vh;
      padding: 24px;

      color: var(--gray-800);
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* =========================
       ENCABEZADO
       ========================= */

    .page-header {
      margin-bottom: 24px;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header .logo {
      width: 48px;
      height: 48px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );

      border-radius: var(--radius-md);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      box-shadow: var(--shadow-md);
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .page-header p {
      font-size: 14px;
      color: var(--gray-500);
    }

    /* =========================
       TARJETAS
       ========================= */

    .card {
      background: white;

      padding: 28px;

      border-radius: var(--radius-lg);

      box-shadow: var(--shadow-md);

      margin-bottom: 20px;

      border: 1px solid var(--gray-100);

      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;

      color: var(--gray-900);

      margin-bottom: 20px;

      padding-bottom: 14px;

      border-bottom:
        1px solid var(--gray-100);

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';

      width: 4px;
      height: 20px;

      background:
        var(--primary);

      border-radius: 2px;
    }

    /* =========================
       FORMULARIO
       ========================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      font-weight: 500;

      color: var(--gray-700);

      margin-bottom: 6px;

      display: flex;
      align-items: center;

      gap: 4px;
    }

    .required::after {
      content: '*';

      color: var(--danger);

      margin-left: 2px;
    }

    input,
    select {
      width: 100%;

      padding: 11px 14px;

      font-size: 14px;

      font-family: inherit;

      border:
        1.5px solid var(--gray-200);

      border-radius:
        var(--radius-sm);

      background:
        var(--gray-50);

      color:
        var(--gray-900);

      transition:
        all 0.15s ease;

      outline: none;
    }

    input::placeholder {
      color: var(--gray-400);
    }

    input:focus,
    select:focus {
      border-color:
        var(--primary);

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(59,130,246,0.15);
    }

    /* =========================
       BUSCADOR MOTIVOS
       ========================= */

    .search-container {
      position: relative;

      margin-bottom: 16px;
    }

    .search-icon {
      position: absolute;

      top: 40px;
      left: 14px;

      color:
        var(--gray-400);

      pointer-events: none;
    }

    #buscarMotivo {
      padding-left: 40px;
    }

    .suggestions-list {
      position: absolute;

      top:
        calc(100% + 4px);

      left: 0;
      right: 0;

      background: white;

      border:
        1px solid var(--gray-200);

      border-radius:
        var(--radius-sm);

      max-height: 220px;

      overflow-y: auto;

      z-index: 1000;

      display: none;

      box-shadow:
        var(--shadow-lg);
    }

    .suggestion-item {
      padding: 10px 14px;

      cursor: pointer;

      font-size: 14px;

      border-bottom:
        1px solid var(--gray-50);

      transition:
        background 0.1s;
    }

    .suggestion-item:hover {
      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }

    /* =========================
       TABLA
       ========================= */

    .table-wrapper {
      overflow-x: auto;

      border-radius:
        var(--radius-md);

      border:
        1px solid var(--gray-200);
    }

    table {
      width: 100%;

      border-collapse:
        collapse;

      font-size: 14px;
    }

    th {
      background:
        var(--gray-800);

      color: white;

      padding: 12px 14px;

      text-align: left;

      font-weight: 500;

      font-size: 13px;

      letter-spacing: 0.3px;
    }

    td {
      padding: 10px 14px;

      border-bottom:
        1px solid var(--gray-100);

      vertical-align: middle;
    }

    tbody tr:hover {
      background:
        var(--gray-50);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td input {
      background: white;

      padding: 8px 12px;

      font-size: 13px;

      border:
        1px solid var(--gray-200);
    }

    td input:focus {
      border-color:
        var(--primary);

      box-shadow:
        0 0 0 2px
        rgba(59,130,246,0.1);
    }

    .empty-state {
      text-align: center;

      padding: 32px 20px;

      color:
        var(--gray-500);

      font-size: 14px;
    }

    /* =========================
       BOTONES
       ========================= */

    .btn-container {
      display: flex;

      gap: 12px;

      margin-top: 8px;

      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;

      border: none;

      border-radius:
        var(--radius-sm);

      cursor: pointer;

      font-weight: 600;

      font-size: 14px;

      font-family: inherit;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      transition:
        all 0.15s ease;
    }

    .btn-save-pdf {
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );

      color: white;

      box-shadow:
        0 2px 4px
        rgba(37,99,235,0.3);
    }

    .btn-save-pdf:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 4px 12px
        rgba(37,99,235,0.35);
    }

    .btn-clear {
      background: white;

      color:
        var(--gray-700);

      border:
        1.5px solid var(--gray-200);
    }

    .btn-clear:hover {
      background:
        var(--gray-50);

      border-color:
        var(--gray-300);
    }

    .btn-delete {
      background:
        var(--danger-light);

      color:
        var(--danger-dark);

      border: none;

      padding: 7px 14px;

      cursor: pointer;

      border-radius:
        var(--radius-sm);

      font-weight: 500;

      font-size: 13px;

      font-family: inherit;

      display: inline-flex;

      align-items: center;

      gap: 5px;

      transition:
        all 0.15s ease;
    }

    .btn-delete:hover {
      background:
        var(--danger);

      color: white;
    }

    /* =========================
       MENSAJES
       ========================= */

    .status-msg {
      margin-top: 16px;

      padding: 12px 16px;

      border-radius:
        var(--radius-sm);

      display: none;

      font-size: 14px;

      align-items: center;

      gap: 10px;

      border-left: 4px solid;
    }

    .status-success {
      background:
        var(--success-light);

      color:
        var(--success-dark);

      border-left-color:
        var(--success);
    }

    .status-error {
      background:
        var(--danger-light);

      color:
        var(--danger-dark);

      border-left-color:
        var(--danger);
    }

    /* =========================
       LOADER
       ========================= */

    .spinner {
      display: inline-block;

      width: 14px;
      height: 14px;

      border:
        2px solid
        rgba(255,255,255,0.3);

      border-top-color:
        white;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    /* =========================
       ESTADO DE CONEXIÓN
       ========================= */

    .connection-status {
      margin-bottom: 20px;

      padding: 10px 14px;

      border-radius:
        var(--radius-sm);

      background:
        var(--gray-100);

      color:
        var(--gray-600);

      font-size: 13px;

      display: flex;

      align-items: center;

      gap: 8px;
    }

    .connection-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background:
        var(--gray-400);
    }

    .connection-ok {
      background:
        var(--success);
    }

    .connection-error {
      background:
        var(--danger);
    }

  </style>
</head>


<body>

<div class="container">

  <!-- =========================
       ENCABEZADO
       ========================= -->

  <div class="page-header">

    <div class="logo">

      <svg
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <polyline
          points="9 11 12 14 20 6">
        </polyline>

        <path
          d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9">
        </path>

      </svg>

    </div>

    <div>

      <h1>Sistema Maestro</h1>

      <p>
        Gestión de devoluciones
      </p>

    </div>

  </div>


  <!-- =========================
       ESTADO CONEXIÓN
       ========================= -->

  <div
    id="estadoConexion"
    class="connection-status">

    <span
      id="connectionDot"
      class="connection-dot">
    </span>

    <span id="connectionText">
      Conectando con Google Apps Script...
    </span>

  </div>


  <!-- =========================
       DATOS DEVOLUCIÓN
       ========================= -->

  <div class="card">

    <h2 class="card-title">
      Datos de la devolución
    </h2>


    <div class="form-grid">

      <!-- FUNCIONARIO -->

      <div class="form-group">

        <label
          for="funcionario"
          class="required">

          Funcionario

        </label>

        <select id="funcionario">

          <option value="">
            Cargando funcionarios...
          </option>

        </select>

      </div>


      <!-- PLACA -->

      <div class="form-group">

        <label for="placa">
          Placa
        </label>

        <input
          type="text"
          id="placa"
          placeholder="Ej. ABC-123"
          autocomplete="off">

      </div>


      <!-- DOCUMENTO -->

      <div class="form-group">

        <label
          for="documento"
          class="required">

          Documento

        </label>

        <input
          type="text"
          id="documento"
          placeholder="Número de documento"
          autocomplete="off">

      </div>


      <!-- CIUDADANO -->

      <div class="form-group">

        <label
          for="ciudadano"
          class="required">

          Ciudadano

        </label>

        <input
          type="text"
          id="ciudadano"
          placeholder="Nombre completo"
          autocomplete="off">

      </div>

    </div>

  </div>


  <!-- =========================
       MOTIVOS
       ========================= -->

  <div class="card">

    <h2 class="card-title">
      Motivos de la devolución
    </h2>


    <div
      class="form-group search-container">

      <label for="buscarMotivo">

        Buscar y agregar motivo

      </label>


      <svg
        class="search-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <circle
          cx="11"
          cy="11"
          r="8">
        </circle>

        <line
          x1="21"
          y1="21"
          x2="16.65"
          y2="16.65">
        </line>

      </svg>


      <input
        type="text"
        id="buscarMotivo"
        placeholder="Escriba para buscar un motivo..."
        autocomplete="off">


      <div
        id="listaSugerencias"
        class="suggestions-list">
      </div>

    </div>


    <!-- TABLA -->

    <div class="table-wrapper">

      <table id="tablaMotivos">

        <thead>

          <tr>

            <th style="width:50px;">
              #
            </th>

            <th>
              Motivo
            </th>

            <th>
              Observación del Motivo
            </th>

            <th style="width:100px;">
              Acción
            </th>

          </tr>

        </thead>


        <tbody id="bodyMotivos">
        </tbody>

      </table>

    </div>

  </div>


  <!-- =========================
       BOTONES
       ========================= -->

  <div class="card">

    <div class="btn-container">

      <button
        id="btnGuardar"
        class="btn btn-save-pdf"
        onclick="guardarYExportarPDF()">

        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path
            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4">
          </path>

          <polyline
            points="7 10 12 15 17 10">
          </polyline>

          <line
            x1="12"
            y1="15"
            x2="12"
            y2="3">
          </line>

        </svg>

        Guardar y Exportar PDF

      </button>


      <button
        class="btn btn-clear"
        onclick="limpiarFormulario()">

        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">

          <polyline
            points="3 6 5 6 21 6">
          </polyline>

          <path
            d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6">
          </path>

        </svg>

        Limpiar

      </button>

    </div>


    <div
      id="mensajeStatus"
      class="status-msg">
    </div>

  </div>

</div>


<script>

/* =========================================================
   URL DEFINITIVA DE LA WEB APP
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxSfqEoua_AMn4s5Wv1iXsc55vNoyA8jUo-pb5XY19ruNj3BcMpGS82Sg1dRZw6ycleag/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let listaMotivosBase = [];

let motivosAgregados = [];

let cargando = false;


/* =========================================================
   JSONP
   ========================================================= */

function requestJSONP(action, params = {}) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_cb_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    let terminado = false;


    function finalizar() {

      if (terminado) {
        return;
      }

      terminado = true;

      try {
        delete window[callbackName];
      } catch (e) {}

      const script =
        document.getElementById(
          callbackName
        );

      if (script) {
        script.remove();
      }

      if (timer) {
        clearTimeout(timer);
      }

    }


    window[callbackName] =
      function(data) {

        finalizar();

        resolve(data);

      };


    let query =
      "?action=" +
      encodeURIComponent(action) +
      "&callback=" +
      encodeURIComponent(callbackName);


    Object.keys(params).forEach(
      function(key) {

        query +=
          "&" +
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(
            params[key]
          );

      }
    );


    const script =
      document.createElement("script");


    script.id = callbackName;


    script.src =
      API_URL + query;


    script.async = true;


    script.onerror =
      function() {

        finalizar();

        reject(
          new Error(
            "No fue posible conectar con Google Apps Script. " +
            "Verifique que la implementación esté activa y tenga acceso para cualquier persona."
          )
        );

      };


    document.body.appendChild(script);


    const timer =
      setTimeout(
        function() {

          if (terminado) {
            return;
          }

          finalizar();

          reject(
            new Error(
              "Tiempo de espera agotado al conectar con Google Apps Script."
            )
          );

        },
        15000
      );

  });

}


/* =========================================================
   INICIO
   ========================================================= */

async function init() {

  mostrarEstadoConexion(
    false,
    "Conectando con Google Apps Script..."
  );


  try {

    const res =
      await requestJSONP(
        "ping"
      );


    if (!res || !res.ok) {

      throw new Error(
        res && res.error
          ? res.error
          : "La API no respondió correctamente."
      );

    }


    mostrarEstadoConexion(
      true,
      "Conexión con Google Apps Script establecida."
    );


    const datos =
      await requestJSONP(
        "getInitialData"
      );


    if (!datos || !datos.ok) {

      throw new Error(
        datos && datos.error
          ? datos.error
          : "No fue posible obtener los datos iniciales."
      );

    }


    cargarFuncionarios(
      datos.funcionarios || []
    );


    listaMotivosBase =
      Array.isArray(datos.motivos)
        ? datos.motivos
        : [];


    renderizarTablaMotivos();


    if (
      datos.funcionarios &&
      datos.funcionarios.length > 0
    ) {

      mostrarEstadoConexion(
        true,
        "Conectado. Funcionarios y motivos cargados correctamente."
      );

    } else {

      mostrarEstadoConexion(
        true,
        "Conectado, pero no se encontraron funcionarios en la hoja FUNCIONARIOS."
      );

    }

  }
  catch (error) {

    console.error(
      "ERROR DE CONEXIÓN:",
      error
    );


    mostrarEstadoConexion(
      false,
      error.message
    );


    mostrarMensaje(
      error.message,
      true
    );


    const select =
      document.getElementById(
        "funcionario"
      );


    select.innerHTML =
      '<option value="">No se pudieron cargar los funcionarios</option>';

  }

}


/* =========================================================
   CARGAR FUNCIONARIOS
   ========================================================= */

function cargarFuncionarios(
  funcionarios
) {

  const select =
    document.getElementById(
      "funcionario"
    );


  select.innerHTML =
    "";


  const opcionInicial =
    document.createElement(
      "option"
    );


  opcionInicial.value =
    "";


  opcionInicial.textContent =
    funcionarios.length > 0
      ? "Seleccione funcionario..."
      : "No hay funcionarios";


  select.appendChild(
    opcionInicial
  );


  funcionarios.forEach(
    function(funcionario) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        funcionario;


      option.textContent =
        funcionario;


      select.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   ESTADO DE CONEXIÓN
   ========================================================= */

function mostrarEstadoConexion(
  conectado,
  mensaje
) {

  const dot =
    document.getElementById(
      "connectionDot"
    );


  const text =
    document.getElementById(
      "connectionText"
    );


  if (conectado) {

    dot.classList.add(
      "connection-ok"
    );

    dot.classList.remove(
      "connection-error"
    );

  } else {

    dot.classList.add(
      "connection-error"
    );

    dot.classList.remove(
      "connection-ok"
    );

  }


  text.textContent =
    mensaje;

}


/* =========================================================
   BUSCADOR DE MOTIVOS
   ========================================================= */

const inputBuscar =
  document.getElementById(
    "buscarMotivo"
  );


const cajaSugerencias =
  document.getElementById(
    "listaSugerencias"
  );


inputBuscar.addEventListener(
  "input",
  function() {

    const texto =
      this.value
        .toLowerCase()
        .trim();


    cajaSugerencias.innerHTML =
      "";


    if (!texto) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    const filtrados =
      listaMotivosBase.filter(
        function(motivo) {

          return String(motivo)
            .toLowerCase()
            .includes(texto);

        }
      );


    if (
      filtrados.length === 0
    ) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    filtrados.forEach(
      function(motivo) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "suggestion-item";


        div.textContent =
          motivo;


        div.onclick =
          function() {

            seleccionarMotivo(
              motivo
            );

          };


        cajaSugerencias.appendChild(
          div
        );

      }
    );


    cajaSugerencias.style.display =
      "block";

  }
);


/* =========================================================
   SELECCIONAR MOTIVO
   ========================================================= */

function seleccionarMotivo(
  motivo
) {

  const existe =
    motivosAgregados.some(
      function(item) {

        return item.motivo === motivo;

      }
    );


  if (existe) {

    mostrarMensaje(
      "Ese motivo ya fue agregado.",
      true
    );

    inputBuscar.value =
      "";

    cajaSugerencias.style.display =
      "none";

    return;

  }


  motivosAgregados.push({

    motivo:
      motivo,

    observacion:
      ""

  });


  inputBuscar.value =
    "";


  cajaSugerencias.style.display =
    "none";


  renderizarTablaMotivos();

}


/* =========================================================
   TABLA DE MOTIVOS
   ========================================================= */

function renderizarTablaMotivos() {

  const tbody =
    document.getElementById(
      "bodyMotivos"
    );


  tbody.innerHTML =
    "";


  if (
    motivosAgregados.length === 0
  ) {

    const tr =
      document.createElement(
        "tr"
      );


    tr.innerHTML = `

      <td
        colspan="4"
        class="empty-state">

        No hay motivos agregados.
        Busque arriba para añadir uno.

      </td>

    `;


    tbody.appendChild(
      tr
    );


    return;

  }


  motivosAgregados.forEach(
    function(item, index) {

      const tr =
        document.createElement(
          "tr"
        );


      const tdNumero =
        document.createElement(
          "td"
        );


      tdNumero.textContent =
        index + 1;


      tdNumero.style.color =
        "var(--gray-500)";


      const tdMotivo =
        document.createElement(
          "td"
        );


      tdMotivo.textContent =
        item.motivo;


      tdMotivo.style.fontWeight =
        "500";


      const tdObservacion =
        document.createElement(
          "td"
        );


      const input =
        document.createElement(
          "input"
        );


      input.type =
        "text";


      input.placeholder =
        "Observación específica...";


      input.value =
        item.observacion || "";


      input.addEventListener(
        "input",
        function() {

          motivosAgregados[index]
            .observacion =
              this.value;

        }
      );


      tdObservacion.appendChild(
        input
      );


      const tdAccion =
        document.createElement(
          "td"
        );


      const boton =
        document.createElement(
          "button"
        );


      boton.className =
        "btn-delete";


      boton.textContent =
        "Quitar";


      boton.onclick =
        function() {

          eliminarMotivo(
            index
          );

        };


      tdAccion.appendChild(
        boton
      );


      tr.appendChild(
        tdNumero
      );


      tr.appendChild(
        tdMotivo
      );


      tr.appendChild(
        tdObservacion
      );


      tr.appendChild(
        tdAccion
      );


      tbody.appendChild(
        tr
      );

    }
  );

}


/* =========================================================
   ELIMINAR MOTIVO
   ========================================================= */

function eliminarMotivo(
  index
) {

  motivosAgregados.splice(
    index,
    1
  );


  renderizarTablaMotivos();

}


/* =========================================================
   GUARDAR Y GENERAR PDF
   ========================================================= */

async function guardarYExportarPDF() {

  if (cargando) {
    return;
  }


  const funcionario =
    document.getElementById(
      "funcionario"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const documento =
    document.getElementById(
      "documento"
    ).value.trim();


  const ciudadano =
    document.getElementById(
      "ciudadano"
    ).value.trim().toUpperCase();


  if (!funcionario) {

    mostrarMensaje(
      "Seleccione un funcionario.",
      true
    );

    return;

  }


  if (!documento) {

    mostrarMensaje(
      "Ingrese el documento.",
      true
    );

    return;

  }


  if (!ciudadano) {

    mostrarMensaje(
      "Ingrese el ciudadano.",
      true
    );

    return;

  }


  if (
    motivosAgregados.length === 0
  ) {

    mostrarMensaje(
      "Debe agregar al menos un motivo de devolución.",
      true
    );

    return;

  }


  const payload = {

    master: {

      funcionario:
        funcionario,

      placa:
        placa,

      documento:
        documento,

      ciudadano:
        ciudadano

    },

    detalles:
      motivosAgregados

  };


  cargando =
    true;


  const boton =
    document.getElementById(
      "btnGuardar"
    );


  boton.disabled =
    true;


  mostrarMensaje(
    "Guardando devolución...",
    false,
    true
  );


  try {

    const resGuardar =
      await requestJSONP(
        "guardarDevolucion",
        {
          data:
            JSON.stringify(
              payload
            )
        }
      );


    if (
      !resGuardar ||
      !resGuardar.ok
    ) {

      throw new Error(
        resGuardar &&
        resGuardar.error
          ? resGuardar.error
          : "No se pudo guardar la devolución."
      );

    }


    const consecutivo =
      resGuardar.id;


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada. Generando PDF...",
      false,
      true
    );


    const resPDF =
      await requestJSONP(
        "generarPDF",
        {
          id:
            consecutivo
        }
      );


    if (
      !resPDF ||
      !resPDF.ok ||
      !resPDF.base64
    ) {

      throw new Error(
        resPDF &&
        resPDF.error
          ? resPDF.error
          : "La devolución fue guardada, pero no fue posible generar el PDF."
      );

    }


    descargarPDF(
      resPDF.base64,
      resPDF.filename ||
      (
        "Devolucion_" +
        consecutivo +
        ".pdf"
      )
    );


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada y PDF generado correctamente.",
      false
    );


  }
  catch (error) {

    console.error(
      error
    );


    mostrarMensaje(
      error.message,
      true
    );

  }
  finally {

    cargando =
      false;

    boton.disabled =
      false;

  }

}


/* =========================================================
   DESCARGAR PDF
   ========================================================= */

function descargarPDF(
  base64,
  filename
) {

  try {

    const byteCharacters =
      atob(base64);


    const byteNumbers =
      new Array(
        byteCharacters.length
      );


    for (
      let i = 0;
      i < byteCharacters.length;
      i++
    ) {

      byteNumbers[i] =
        byteCharacters.charCodeAt(
          i
        );

    }


    const byteArray =
      new Uint8Array(
        byteNumbers
      );


    const blob =
      new Blob(
        [byteArray],
        {
          type:
            "application/pdf"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      filename;


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );

  }
  catch (error) {

    console.error(
      error
    );

    throw new Error(
      "No fue posible descargar el PDF."
    );

  }

}


/* =========================================================
   LIMPIAR
   ========================================================= */

function limpiarFormulario() {

  document.getElementById(
    "funcionario"
  ).value =
    "";


  document.getElementById(
    "placa"
  ).value =
    "";


  document.getElementById(
    "documento"
  ).value =
    "";


  document.getElementById(
    "ciudadano"
  ).value =
    "";


  document.getElementById(
    "buscarMotivo"
  ).value =
    "";


  motivosAgregados =
    [];


  renderizarTablaMotivos();


  ocultarMensaje();

}


/* =========================================================
   MENSAJES
   ========================================================= */

function mostrarMensaje(
  msg,
  esError = false,
  loading = false
) {

  const box =
    document.getElementById(
      "mensajeStatus"
    );


  box.innerHTML =
    "";


  if (loading) {

    const spinner =
      document.createElement(
        "span"
      );


    spinner.className =
      "spinner";


    box.appendChild(
      spinner
    );

  }


  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    msg;


  box.appendChild(
    span
  );


  box.className =
    "status-msg " +
    (
      esError
        ? "status-error"
        : "status-success"
    );


  box.style.display =
    "flex";

}


function ocultarMensaje() {

  document.getElementById(
    "mensajeStatus"
  ).style.display =
    "none";

}

   CERRAR SUGERENCIAS
   ========================================================= */

    if (
      !e.target.closest(
        ".search-container"
      )
    ) {

      cajaSugerencias.style.display =
        "none";

    }

  }
);

).addEventListener(

document.getElementById(

  }
);

document.addEventListener(

    init();

  }
);
