<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema Maestro - Devoluciones</title>

<style>
:root {
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --success:#16a34a;
  --danger:#dc2626;
  --gray-50:#f9fafb;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-400:#9ca3af;
  --gray-500:#6b7280;
  --gray-700:#374151;
  --gray-800:#1f2937;
  --gray-900:#111827;
  --radius:10px;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eef2f7,#dfe8f5);
  min-height:100vh;
  padding:25px;
  color:var(--gray-800);
}

.container {
  max-width:1100px;
  margin:auto;
}

.header {
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.logo {
  width:52px;
  height:52px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.header h1 {
  font-size:25px;
  color:var(--gray-900);
}

.header p {
  color:var(--gray-500);
  margin-top:3px;
}

.card {
  background:white;
  border-radius:14px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card-title {
  font-size:18px;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid var(--gray-200);
  color:var(--gray-900);
}

.form-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.form-group {
  display:flex;
  flex-direction:column;
}

label {
  font-size:13px;
  font-weight:bold;
  color:var(--gray-700);
  margin-bottom:6px;
}

.required::after {
  content:" *";
  color:var(--danger);
}

input,
select {
  width:100%;
  padding:12px 13px;
  border:1px solid var(--gray-200);
  border-radius:7px;
  background:var(--gray-50);
  font-size:14px;
  outline:none;
}

input:focus,
select:focus {
  border-color:var(--primary);
  background:white;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

select {
  cursor:pointer;
}

.search-container {
  position:relative;
  margin-bottom:20px;
}

#buscarMotivo {
  padding-left:40px;
}

.search-icon {
  position:absolute;
  left:13px;
  top:36px;
  color:var(--gray-400);
}

.suggestions {
  position:absolute;
  left:0;
  right:0;
  top:100%;
  margin-top:4px;
  background:white;
  border:1px solid var(--gray-200);
  border-radius:7px;
  max-height:220px;
  overflow-y:auto;
  display:none;
  z-index:9999;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.suggestion {
  padding:11px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--gray-100);
  font-size:14px;
}

.suggestion:hover {
  background:#dbeafe;
  color:#1d4ed8;
}

.table-wrapper {
  overflow-x:auto;
  border:1px solid var(--gray-200);
  border-radius:8px;
}

table {
  width:100%;
  border-collapse:collapse;
}

th {
  background:var(--gray-800);
  color:white;
  padding:12px;
  text-align:left;
  font-size:13px;
}

td {
  padding:10px 12px;
  border-bottom:1px solid var(--gray-100);
  font-size:13px;
}

td input {
  background:white;
  padding:8px 10px;
}

.empty {
  text-align:center;
  padding:30px;
  color:var(--gray-500);
}

.buttons {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

button {
  border:0;
  border-radius:7px;
  padding:12px 20px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.btn-primary {
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
}

.btn-secondary {
  background:white;
  color:var(--gray-700);
  border:1px solid var(--gray-200);
}

.btn-danger {
  background:#fee2e2;
  color:#991b1b;
  padding:7px 12px;
}

button:disabled {
  opacity:.6;
  cursor:not-allowed;
}

.status {
  display:none;
  margin-top:15px;
  padding:12px 15px;
  border-radius:7px;
  font-size:14px;
}

.status.success {
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error {
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.info {
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.loading {
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(0,0,0,.2);
  border-top-color:currentColor;
  border-radius:50%;
  animation:girar .7s linear infinite;
  margin-right:8px;
  vertical-align:-2px;
}

@keyframes girar {
  to {
    transform:rotate(360deg);
  }
}

.api-status {
  font-size:12px;
  margin-top:6px;
  color:var(--gray-500);
}

@media(max-width:700px) {
  body {
    padding:12px;
  }

  .form-grid {
    grid-template-columns:1fr;
  }

  .card {
    padding:18px;
  }

  .header h1 {
    font-size:21px;
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">✓</div>
    <div>
      <h1>Sistema Maestro</h1>
      <p>Gestión de devoluciones</p>
      <div id="apiStatus" class="api-status">
        Conectando con Google Apps Script...
      </div>
    </div>
  </div>

  <!-- MOTIVOS -->

  <div class="card">

```
<h2 class="card-title">
  Motivos de la devolución
</h2>

<div class="form-group search-container">

  <label for="buscarMotivo">
    Buscar y agregar motivo
  </label>

  <div class="search-icon">

  <input

<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbz0drxHb69aZ2EiajQOM5ObodCUNKIDxsXuJL_a182JNUA2iIcXlgpPMX4iSrhfBegjuA/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let listaMotivosBase = [];
let motivosAgregados = [];


/* =========================================================
   JSONP
   ========================================================= */

function requestJSONP(action, params = {}, timeout = 20000) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_callback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    let terminado = false;

    const script = document.createElement("script");

    const limpiar = () => {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch(e) {
        window[callbackName] = undefined;
      }

      clearTimeout(timer);
    };


    window[callbackName] = function(data) {

      if (terminado) return;

      terminado = true;

      limpiar();

      resolve(data);

    };


    let url =
      API_URL +
      "?action=" +
      encodeURIComponent(action) +
      "&callback=" +
      encodeURIComponent(callbackName);


    Object.keys(params).forEach(function(key) {

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(params[key]);

    });


    script.src = url;

    script.async = true;


    script.onerror = function() {

      if (terminado) return;

      terminado = true;

      limpiar();

      reject(
        new Error(
          "No fue posible conectar con Google Apps Script."
        )
      );

    };


    const timer = setTimeout(function() {

      if (terminado) return;

      terminado = true;

      limpiar();

      reject(
        new Error(
          "Tiempo de espera agotado al conectar con Google Apps Script."
        )
      );

    }, timeout);


    document.body.appendChild(script);

  });

}


/* =========================================================
   INICIO
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  iniciarSistema
);


async function iniciarSistema() {

  mostrarEstadoAPI(
    "Conectando con Google Apps Script...",
    "info"
  );

  try {

    const respuesta =
      await requestJSONP(
        "getInitialData"
      );


    console.log(
      "Respuesta getInitialData:",
      respuesta
    );


    if (!respuesta) {

      throw new Error(
        "Google Apps Script no devolvió datos."
      );

    }


    if (!respuesta.ok) {

      throw new Error(
        respuesta.error ||
        "Google Apps Script devolvió un error."
      );

    }


    listaMotivosBase =
      Array.isArray(respuesta.motivos)
        ? respuesta.motivos
        : [];


    cargarFuncionarios(
      Array.isArray(respuesta.funcionarios)
        ? respuesta.funcionarios
        : []
    );


    renderizarTablaMotivos();


    mostrarEstadoAPI(
      "✓ Conectado correctamente con Google Apps Script.",
      "success"
    );


    console.log(
      "Funcionarios:",
      respuesta.funcionarios
    );

    console.log(
      "Motivos:",
      respuesta.motivos
    );

  }

  catch(error) {

    console.error(
      "Error de conexión:",
      error
    );


    mostrarEstadoAPI(
      "✕ " + error.message,
      "error"
    );


    mostrarMensaje(
      error.message +
      " Verifique que la implementación de Apps Script esté activa.",
      true
    );

  }

}


/* =========================================================
   CARGAR FUNCIONARIOS
   ========================================================= */

function cargarFuncionarios(lista) {

  const select =
    document.getElementById(
      "funcionario"
    );


  select.innerHTML = "";


  const opcionInicial =
    document.createElement("option");

  opcionInicial.value = "";

  opcionInicial.textContent =
    lista.length > 0
      ? "Seleccione funcionario..."
      : "No hay funcionarios registrados";


  select.appendChild(
    opcionInicial
  );


  lista.forEach(function(funcionario) {

    const opcion =
      document.createElement("option");

    opcion.value = funcionario;

    opcion.textContent = funcionario;

    select.appendChild(
      opcion
    );

  });

}


/* =========================================================
   BUSCADOR DE MOTIVOS
   ========================================================= */

const inputBuscar =
  document.getElementById(
    "buscarMotivo"
  );


const cajaSugerencias =
  document.getElementById(
    "listaSugerencias"
  );


inputBuscar.addEventListener(
  "input",
  function() {

    const texto =
      this.value
        .toLowerCase()
        .trim();


    cajaSugerencias.innerHTML = "";


    if (!texto) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    const filtrados =
      listaMotivosBase.filter(
        function(motivo) {

          return String(motivo)
            .toLowerCase()
            .includes(texto);

        }
      );


    if (filtrados.length === 0) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    filtrados.forEach(
      function(motivo) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "suggestion";

        div.textContent =
          motivo;

        div.addEventListener(
          "click",
          function() {

            seleccionarMotivo(
              motivo
            );

          }
        );

        cajaSugerencias.appendChild(
          div
        );

      }
    );


    cajaSugerencias.style.display =
      "block";

  }
);


/* =========================================================
   SELECCIONAR MOTIVO
   ========================================================= */

function seleccionarMotivo(motivo) {

  motivosAgregados.push({

    motivo: motivo,

    observacion: ""

  });


  inputBuscar.value = "";

  cajaSugerencias.style.display =
    "none";


  renderizarTablaMotivos();

}


/* =========================================================
   TABLA MOTIVOS
   ========================================================= */

function renderizarTablaMotivos() {

  const tbody =
    document.getElementById(
      "bodyMotivos"
    );


  tbody.innerHTML = "";


  if (
    motivosAgregados.length === 0
  ) {

    const tr =
      document.createElement("tr");


    tr.innerHTML =
      `
      <td colspan="4" class="empty">
        No hay motivos agregados.
        Busque arriba para añadir uno.
      </td>
      `;


    tbody.appendChild(tr);

    return;

  }


  motivosAgregados.forEach(
    function(item,index) {

      const tr =
        document.createElement("tr");


      const tdNumero =
        document.createElement("td");

      tdNumero.textContent =
        index + 1;


      const tdMotivo =
        document.createElement("td");

      tdMotivo.textContent =
        item.motivo;


      const tdObservacion =
        document.createElement("td");


      const input =
        document.createElement("input");

      input.type = "text";

      input.placeholder =
        "Observación específica...";

      input.value =
        item.observacion;


      input.addEventListener(
        "input",
        function() {

          motivosAgregados[index]
            .observacion =
            this.value;

        }
      );


      tdObservacion.appendChild(
        input
      );


      const tdAccion =
        document.createElement("td");


      const boton =
        document.createElement(
          "button"
        );

      boton.className =
        "btn-danger";

      boton.textContent =
        "Quitar";


      boton.addEventListener(
        "click",
        function() {

          eliminarMotivo(index);

        }
      );


      tdAccion.appendChild(
        boton
      );


      tr.appendChild(tdNumero);

      tr.appendChild(tdMotivo);

      tr.appendChild(tdObservacion);

      tr.appendChild(tdAccion);


      tbody.appendChild(tr);

    }
  );

}


/* =========================================================
   ELIMINAR MOTIVO
   ========================================================= */

function eliminarMotivo(index) {

  motivosAgregados.splice(
    index,
    1
  );

  renderizarTablaMotivos();

}


/* =========================================================
   GUARDAR
   ========================================================= */

async function guardarYExportarPDF() {

  const funcionario =
    document.getElementById(
      "funcionario"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const documento =
    document.getElementById(
      "documento"
    ).value.trim();


  const ciudadano =
    document.getElementById(
      "ciudadano"
    ).value.trim().toUpperCase();


  if (!funcionario) {

    mostrarMensaje(
      "Debe seleccionar un funcionario.",
      true
    );

    return;

  }


  if (!documento) {

    mostrarMensaje(
      "Debe ingresar el documento.",
      true
    );

    return;

  }


  if (!ciudadano) {

    mostrarMensaje(
      "Debe ingresar el ciudadano.",
      true
    );

    return;

  }


  const payload = {

    master: {

      funcionario:
        funcionario,

      placa:
        placa,

      documento:
        documento,

      ciudadano:
        ciudadano

    },

    detalles:
      motivosAgregados

  };


  const boton =
    document.getElementById(
      "btnGuardar"
    );


  boton.disabled = true;


  mostrarMensaje(
    "Guardando devolución...",
    false,
    true
  );


  try {

    const respuesta =
      await requestJSONP(
        "guardarDevolucion",
        {
          data:
            JSON.stringify(
              payload
            )
        },
        30000
      );


    console.log(
      "Respuesta guardado:",
      respuesta
    );


    if (
      !respuesta ||
      !respuesta.ok
    ) {

      throw new Error(
        respuesta &&
        respuesta.error
          ? respuesta.error
          : "No se pudo guardar la devolución."
      );

    }


    const consecutivo =
      respuesta.id;


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada. Generando PDF...",
      false,
      true
    );


    const respuestaPDF =
      await requestJSONP(
        "generarPDF",
        {
          id:
            consecutivo
        },
        60000
      );


    if (
      !respuestaPDF ||
      !respuestaPDF.ok
    ) {

      throw new Error(
        respuestaPDF &&
        respuestaPDF.error
          ? respuestaPDF.error
          : "La devolución fue guardada, pero no se pudo generar el PDF."
      );

    }


    if (
      !respuestaPDF.base64
    ) {

      throw new Error(
        "Google Apps Script no devolvió el archivo PDF."
      );

    }


    const enlace =
      document.createElement(
        "a"
      );


    enlace.href =
      "data:application/pdf;base64," +
      respuestaPDF.base64;


    enlace.download =
      respuestaPDF.filename ||
      (
        "Devolucion_" +
        consecutivo +
        ".pdf"
      );


    document.body.appendChild(
      enlace
    );


    enlace.click();


    enlace.remove();


    mostrarMensaje(
      "✓ Devolución N° " +
      consecutivo +
      " guardada y PDF generado correctamente.",
      false
    );


  }

  catch(error) {

    console.error(
      error
    );


    mostrarMensaje(
      error.message,
      true
    );

  }

  finally {

    boton.disabled = false;

  }

}


/* =========================================================
   LIMPIAR
   ========================================================= */

function limpiarFormulario() {

  document.getElementById(
    "funcionario"
  ).value = "";


  document.getElementById(
    "placa"
  ).value = "";


  document.getElementById(
    "documento"
  ).value = "";


  document.getElementById(
    "ciudadano"
  ).value = "";


  inputBuscar.value = "";


  cajaSugerencias.style.display =
    "none";


  motivosAgregados = [];


  renderizarTablaMotivos();


  document.getElementById(
    "mensajeStatus"
  ).style.display =
    "none";

}


/* =========================================================
   MENSAJES
   ========================================================= */

function mostrarMensaje(
  mensaje,
  error = false,
  cargando = false
) {

  const box =
    document.getElementById(
      "mensajeStatus"
    );


  box.className =
    "status " +
    (
      error
        ? "error"
        : "success"
    );


  box.innerHTML =
    (
      cargando
        ? '<span class="loading"></span>'
        : ""
    ) +
    mensaje;


  box.style.display =
    "block";

}


/* =========================================================
   ESTADO API
   ========================================================= */

function mostrarEstadoAPI(
  mensaje,
  tipo
) {

  const elemento =
    document.getElementById(
      "apiStatus"
    );


  elemento.textContent =
    mensaje;


  if (tipo === "error") {

    elemento.style.color =
      "#dc2626";

  }

  else if (tipo === "success") {

    elemento.style.color =
      "#16a34a";

  }

  else {

    elemento.style.color =
      "#6b7280";

  }

}


/* =========================================================
   CERRAR SUGERENCIAS
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".search-container"
      )
    ) {

      cajaSugerencias.style.display =
        "none";

    }

  }
);


/* =========================================================
   MAYÚSCULAS
   ========================================================= */

document.getElementById(
  "placa"
).addEventListener(
  "input",
  function() {

    this.value =
      this.value.toUpperCase();

  }
);


document.getElementById(
  "ciudadano"
).addEventListener(
  "input",
  function() {

    this.value =
      this.value.toUpperCase();

  }
);

</script>

</body>
</html>
