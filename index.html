<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
     content="Sistema Maestro-Detalle de Devoluciones - Secretaría de Movilidad La Ceja del Tambo">

  <title>Sistema Maestro - Devoluciones</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;

      --success: #10b981;
      --success-light: #d1fae5;
      --success-dark: #065f46;

      --danger: #ef4444;
      --danger-light: #fee2e2;
      --danger-dark: #991b1b;

      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-sm:
        0 1px 2px rgba(0,0,0,0.05);

      --shadow-md:
        0 4px 6px -1px rgba(0,0,0,0.08),
        0 2px 4px -2px rgba(0,0,0,0.05);

      --shadow-lg:
        0 10px 15px -3px rgba(0,0,0,0.08),
        0 4px 6px -4px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(
          135deg,
          #f0f4f8 0%,
          #e4ecf7 100%
        );
      min-height: 100vh;
      padding: 24px;
      color: var(--gray-800);
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* =========================
       ENCABEZADO
       ========================= */

    .page-header {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header .logo {
      width: 48px;
      height: 48px;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .page-header p {
      font-size: 14px;
      color: var(--gray-500);
    }

    /* =========================
       TARJETAS
       ========================= */

    .card {
      background: white;
      padding: 28px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 1px solid var(--gray-100);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* =========================
       FORMULARIO
       ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .page-header h1 {
        font-size: 20px;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .required::after {
      content: '*';
      color: var(--danger);
      margin-left: 2px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      background: var(--gray-50);
      color: var(--gray-900);
      transition: all 0.15s ease;
      outline: none;
    }

    input::placeholder {
      color: var(--gray-400);
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow:
        0 0 0 3px rgba(59,130,246,0.15);
    }

    /* =========================
       MAYÚSCULAS
       ========================= */

    #placa,
    #ciudadano {
      text-transform: uppercase;
    }

    /* =========================
       BUSCADOR DE MOTIVOS
       ========================= */

    .search-container {
      position: relative;
      margin-bottom: 16px;
    }

    .search-icon {
      position: absolute;
      top: 39px;
      left: 14px;
      color: var(--gray-400);
      pointer-events: none;
    }

    #buscarMotivo {
      padding-left: 40px;
    }

    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: var(--shadow-lg);
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--gray-50);
      transition: background 0.1s;
    }

    .suggestion-item:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    /* =========================
       TABLA
       ========================= */

    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 700px;
    }

    th {
      background: var(--gray-800);
      color: white;
      padding: 12px 14px;
      text-align: left;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: var(--gray-50);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td input {
      background: white;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--gray-200);
    }

    td input:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 2px rgba(59,130,246,0.1);
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--gray-500);
      font-size: 14px;
    }

    /* =========================
       BOTONES
       ========================= */

    .btn-container {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-save-pdf {
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
      color: white;
      box-shadow:
        0 2px 4px rgba(37,99,235,0.3);
    }

    .btn-save-pdf:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 4px 12px rgba(37,99,235,0.35);
    }

    .btn-clear {
      background: white;
      color: var(--gray-700);
      border: 1.5px solid var(--gray-200);
    }

    .btn-clear:hover {
      background: var(--gray-50);
      border-color: var(--gray-300);
    }

    .btn-delete {
      background: var(--danger-light);
      color: var(--danger-dark);
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    /* =========================
       MENSAJES
       ========================= */

    .status-msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      display: none;
      font-size: 14px;
      align-items: center;
      gap: 10px;
      border-left: 4px solid;
    }

    .status-success {
      background: var(--success-light);
      color: var(--success-dark);
      border-left-color: var(--success);
    }

    .status-error {
      background: var(--danger-light);
      color: var(--danger-dark);
      border-left-color: var(--danger);
    }

    /* =========================
       SPINNER
       ========================= */

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       ESTADO DE CONEXIÓN
       ========================= */

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-left: auto;
      padding: 6px 10px;
      border-radius: 20px;
      background: var(--gray-100);
      color: var(--gray-500);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gray-400);
    }

    .connection.ok {
      background: var(--success-light);
      color: var(--success-dark);
    }

    .connection.ok .connection-dot {
      background: var(--success);
    }

    .connection.error {
      background: var(--danger-light);
      color: var(--danger-dark);
    }

    .connection.error .connection-dot {
      background: var(--danger);
    }
  </style>

</head>

<script>

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

/*
   IMPORTANTE:

   Esta es la URL CORRECTA de tu Web App de Google Apps Script.

   NO colocar:
   hhttps://
   https:// dentro de comillas adicionales
   etiquetas HTML
   ni enlaces Markdown.
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbx3k0qOuhSXnRF50fIrkmaSqBXFcW0Lp2K0Ji2bB0o9flHEvyLWLtFBkTvAhDLkms1ylQ/exec";


/* ============================================================
   VARIABLES
   ============================================================ */

let listaMotivosBase = [];
let motivosAgregados = [];

let solicitudActiva = false;


/* ============================================================
   ELEMENTOS
   ============================================================ */

const inputBuscar =
  document.getElementById("buscarMotivo");

const cajaSugerencias =
  document.getElementById("listaSugerencias");

const estadoConexion =
  document.getElementById("estadoConexion");

const textoConexion =
  document.getElementById("textoConexion");

const selectFuncionario =
  document.getElementById("funcionario");

const btnGuardar =
  document.getElementById("btnGuardar");


/* ============================================================
   JSONP
   ============================================================ */

function requestJSONP(action, params = {}, timeout = 20000) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_cb_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    let terminado = false;


    const script =
      document.createElement("script");


    const limpiar = () => {

      if (terminado) return;

      terminado = true;

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


    const timer =
      setTimeout(() => {

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado al conectar con Google Apps Script."
          )
        );

      }, timeout);


    window[callbackName] = function(data) {

      limpiar();

      resolve(data);

    };


    let query =
      "?action=" +
      encodeURIComponent(action) +
      "&callback=" +
      encodeURIComponent(callbackName);


    Object.keys(params).forEach(key => {

      const value =
        params[key] === null ||
        params[key] === undefined
          ? ""
          : params[key];


      query +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(value);

    });


    script.id = callbackName;

    script.async = true;

    script.src =
      API_URL + query;


    script.onerror = function() {

      limpiar();

      reject(
        new Error(
          "No fue posible conectar con Google Apps Script."
        )
      );

    };


    document.body.appendChild(script);

  });

}


/* ============================================================
   INICIALIZAR
   ============================================================ */

async function init() {

  renderizarTablaMotivos();

  mostrarMensaje(
    "Conectando con Google Apps Script...",
    false,
    true
  );


  try {

    const res =
      await requestJSONP(
        "getInitialData"
      );


    if (!res) {

      throw new Error(
        "Google Apps Script no devolvió ninguna respuesta."
      );

    }


    if (!res.ok) {

      throw new Error(
        res.error ||
        "Google Apps Script devolvió un error."
      );

    }


    /* FUNCIONARIOS */

    selectFuncionario.innerHTML =
      '<option value="">Seleccione funcionario...</option>';


    const funcionarios =
      Array.isArray(res.funcionarios)
        ? res.funcionarios
        : [];


    funcionarios.forEach(funcionario => {

      const option =
        document.createElement("option");

      option.value = funcionario;

      option.textContent = funcionario;

      selectFuncionario.appendChild(option);

    });


    /* MOTIVOS */

    listaMotivosBase =
      Array.isArray(res.motivos)
        ? res.motivos
        : [];


    /* ESTADO */

    estadoConexion.className =
      "connection ok";

    textoConexion.textContent =
      "Conectado";


    mostrarMensaje(
      "Conexión establecida correctamente. Funcionarios: " +
      funcionarios.length +
      " | Motivos: " +
      listaMotivosBase.length,
      false
    );


    setTimeout(() => {

      ocultarMensaje();

    }, 4000);


  } catch (error) {

    console.error(
      "Error de conexión:",
      error
    );


    estadoConexion.className =
      "connection error";

    textoConexion.textContent =
      "Sin conexión";


    selectFuncionario.innerHTML =
      '<option value="">No fue posible cargar funcionarios</option>';


    mostrarMensaje(
      error.message ||
      "No fue posible conectar con Google Apps Script.",
      true
    );

  }

}


/* ============================================================
   BUSCADOR DE MOTIVOS
   ============================================================ */

inputBuscar.addEventListener(
  "input",
  function() {

    const texto =
      this.value
        .toLowerCase()
        .trim();


    cajaSugerencias.innerHTML =
      "";


    if (!texto) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    const filtrados =
      listaMotivosBase.filter(
        motivo =>
          String(motivo)
            .toLowerCase()
            .includes(texto)
      );


    if (
      filtrados.length === 0
    ) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    filtrados.forEach(motivo => {

      const div =
        document.createElement("div");


      div.className =
        "suggestion-item";


      div.textContent =
        motivo;


      div.addEventListener(
        "click",
        () => {

          seleccionarMotivo(
            motivo
          );

        }
      );


      cajaSugerencias.appendChild(
        div
      );

    });


    cajaSugerencias.style.display =
      "block";

  }
);


/* ============================================================
   SELECCIONAR MOTIVO
   ============================================================ */

function seleccionarMotivo(motivo) {

  /*
     Evita agregar exactamente el mismo
     motivo dos veces.
  */

  const existe =
    motivosAgregados.some(
      item =>
        String(item.motivo)
          .trim()
          .toLowerCase() ===
        String(motivo)
          .trim()
          .toLowerCase()
    );


  if (existe) {

    mostrarMensaje(
      "Ese motivo ya fue agregado.",
      true
    );

    return;

  }


  motivosAgregados.push({
    motivo: motivo,
    observacion: ""
  });


  inputBuscar.value = "";

  cajaSugerencias.style.display =
    "none";


  renderizarTablaMotivos();

}


/* ============================================================
   RENDERIZAR TABLA
   ============================================================ */

function renderizarTablaMotivos() {

  const tbody =
    document.getElementById(
      "bodyMotivos"
    );


  tbody.innerHTML =
    "";


  if (
    motivosAgregados.length === 0
  ) {

    const tr =
      document.createElement("tr");


    const td =
      document.createElement("td");


    td.colSpan = 4;

    td.className =
      "empty-state";


    td.innerHTML = `
      <svg
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>

      <div>
        No hay motivos agregados.
        Busque arriba para añadir uno.
      </div>
    `;


    tr.appendChild(td);

    tbody.appendChild(tr);

    return;

  }


  motivosAgregados.forEach(
    (item, index) => {

      const tr =
        document.createElement("tr");


      /* NUMERO */

      const tdNumero =
        document.createElement("td");

      tdNumero.textContent =
        index + 1;

      tdNumero.style.color =
        "var(--gray-500)";

      tdNumero.style.fontWeight =
        "500";


      /* MOTIVO */

      const tdMotivo =
        document.createElement("td");

      tdMotivo.textContent =
        item.motivo;

      tdMotivo.style.fontWeight =
        "500";

      tdMotivo.style.color =
        "var(--gray-800)";


      /* OBSERVACIÓN */

      const tdObservacion =
        document.createElement("td");


      const input =
        document.createElement("input");


      input.type =
        "text";


      input.placeholder =
        "Observación específica...";


      input.value =
        item.observacion || "";


      input.addEventListener(
        "input",
        function() {

          motivosAgregados[index]
            .observacion =
              this.value;

        }
      );


      tdObservacion.appendChild(
        input
      );


      /* ACCIÓN */

      const tdAccion =
        document.createElement("td");


      const boton =
        document.createElement("button");


      boton.type =
        "button";


      boton.className =
        "btn-delete";


      boton.innerHTML = `
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>
        </svg>

        Quitar
      `;


      boton.addEventListener(
        "click",
        () => {

          eliminarMotivo(
            index
          );

        }
      );


      tdAccion.appendChild(
        boton
      );


      tr.appendChild(tdNumero);
      tr.appendChild(tdMotivo);
      tr.appendChild(tdObservacion);
      tr.appendChild(tdAccion);


      tbody.appendChild(tr);

    }
  );

}


/* ============================================================
   ELIMINAR MOTIVO
   ============================================================ */

function eliminarMotivo(index) {

  motivosAgregados.splice(
    index,
    1
  );


  renderizarTablaMotivos();

}


/* ============================================================
   GUARDAR Y GENERAR PDF
   ============================================================ */

async function guardarYExportarPDF() {

  if (solicitudActiva) {
    return;
  }


  const funcionario =
    selectFuncionario.value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value
      .trim()
      .toUpperCase();


  const documento =
    document.getElementById(
      "documento"
    ).value.trim();


  const ciudadano =
    document.getElementById(
      "ciudadano"
    ).value
      .trim()
      .toUpperCase();


  /* VALIDACIONES */

  if (!funcionario) {

    mostrarMensaje(
      "Debe seleccionar un funcionario.",
      true
    );

    selectFuncionario.focus();

    return;

  }


  if (!documento) {

    mostrarMensaje(
      "Debe ingresar el documento.",
      true
    );

    document.getElementById(
      "documento"
    ).focus();

    return;

  }


  if (!ciudadano) {

    mostrarMensaje(
      "Debe ingresar el ciudadano.",
      true
    );

    document.getElementById(
      "ciudadano"
    ).focus();

    return;

  }


  if (
    motivosAgregados.length === 0
  ) {

    mostrarMensaje(
      "Debe agregar al menos un motivo de devolución.",
      true
    );

    inputBuscar.focus();

    return;

  }


  /* PAYLOAD */

  const payload = {

    master: {

      funcionario:
        funcionario,

      placa:
        placa,

      documento:
        documento,

      ciudadano:
        ciudadano

    },

    detalles:
      motivosAgregados.map(item => ({

        motivo:
          String(item.motivo || "")
            .trim(),

        observacion:
          String(item.observacion || "")
            .trim()

      }))

  };


  solicitudActiva = true;

  btnGuardar.disabled =
    true;


  try {

    /* =====================================
       GUARDAR
       ===================================== */

    mostrarMensaje(
      "Guardando devolución...",
      false,
      true
    );


    const resGuardar =
      await requestJSONP(
        "guardarDevolucion",
        {
          data:
            JSON.stringify(payload)
        },
        30000
      );


    console.log(
      "Respuesta guardar:",
      resGuardar
    );


    if (
      !resGuardar ||
      !resGuardar.ok
    ) {

      throw new Error(
        resGuardar &&
        resGuardar.error
          ? resGuardar.error
          : "No se pudo guardar la devolución."
      );

    }


    const consecutivo =
      resGuardar.id;


    /* =====================================
       GENERAR PDF
       ===================================== */

    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada. Generando PDF...",
      false,
      true
    );


    const resPDF =
      await requestJSONP(
        "generarPDF",
        {
          id:
            consecutivo
        },
        60000
      );


    console.log(
      "Respuesta PDF:",
      resPDF
    );


    if (
      !resPDF ||
      !resPDF.ok ||
      !resPDF.base64
    ) {

      throw new Error(
        resPDF &&
        resPDF.error
          ? resPDF.error
          : "La devolución se guardó, pero no fue posible generar el PDF."
      );

    }


    /* =====================================
       DESCARGAR PDF
       ===================================== */

    descargarPDF(
      resPDF.base64,
      resPDF.filename ||
        (
          "Devolucion_" +
          consecutivo +
          ".pdf"
        )
    );


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada correctamente. PDF generado y descargado.",
      false
    );


  } catch (error) {

    console.error(
      "Error:",
      error
    );


    mostrarMensaje(
      error.message ||
      "Ocurrió un error durante el proceso.",
      true
    );


  } finally {

    solicitudActiva =
      false;

    btnGuardar.disabled =
      false;

  }

}


/* ============================================================
   DESCARGAR PDF
   ============================================================ */

function descargarPDF(
  base64,
  filename
) {

  const byteCharacters =
    atob(base64);


  const byteNumbers =
    new Array(
      byteCharacters.length
    );


  for (
    let i = 0;
    i < byteCharacters.length;
    i++
  ) {

    byteNumbers[i] =
      byteCharacters.charCodeAt(i);

  }


  const byteArray =
    new Uint8Array(
      byteNumbers
    );


  const blob =
    new Blob(
      [byteArray],
      {
        type:
          "application/pdf"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement("a");


  link.href =
    url;


  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {
      URL.revokeObjectURL(url);
    },
    1000
  );

}


/* ============================================================
   LIMPIAR FORMULARIO
   ============================================================ */

function limpiarFormulario() {

  if (solicitudActiva) {
    return;
  }


  selectFuncionario.value =
    "";


  document.getElementById(
    "placa"
  ).value = "";


  document.getElementById(
    "documento"
  ).value = "";


  document.getElementById(
    "ciudadano"
  ).value = "";


  inputBuscar.value =
    "";


  cajaSugerencias.style.display =
    "none";


  motivosAgregados =
    [];


  renderizarTablaMotivos();

  ocultarMensaje();

}


/* ============================================================
   MENSAJES
   ============================================================ */

function mostrarMensaje(
  msg,
  esError = false,
  loading = false
) {

  const box =
    document.getElementById(
      "mensajeStatus"
    );


  box.innerHTML =
    "";


  if (loading) {

    const spinner =
      document.createElement(
        "span"
      );

    spinner.className =
      "spinner";

    box.appendChild(
      spinner
    );

  }


  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    msg;


  box.appendChild(
    span
  );


  box.className =
    "status-msg " +
    (
      esError
        ? "status-error"
        : "status-success"
    );


  box.style.display =
    "flex";

}


/* ============================================================
   OCULTAR MENSAJE
   ============================================================ */

function ocultarMensaje() {

  const box =
    document.getElementById(
      "mensajeStatus"
    );


  box.style.display =
    "none";

}


/* ============================================================
   CERRAR SUGERENCIAS
   ============================================================ */

document.addEventListener(
  "click",
  function(e) {

    if (
      !e.target.closest(
        ".search-container"
      )
    ) {

      cajaSugerencias.style.display =
        "none";

    }

  }
);


/* ============================================================
   MAYÚSCULAS
   ============================================================ */

document.getElementById(
  "placa"
).addEventListener(
  "input",
  function() {

    this.value =
      this.value.toUpperCase();

  }
);


document.getElementById(
  "ciudadano"
).addEventListener(
  "input",
  function() {

    this.value =
      this.value.toUpperCase();

  }
);


/* ============================================================
   ENTER EN BUSCADOR
   ============================================================ */

inputBuscar.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key !== "Enter"
    ) {
      return;
    }


    e.preventDefault();


    const primera =
      cajaSugerencias.querySelector(
        ".suggestion-item"
      );


    if (primera) {

      primera.click();

    }

  }
);


/* ============================================================
   INICIO
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    init();

  }
);

</script>
