<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema Maestro - Devoluciones</title>

<style>
:root {
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-light:#dbeafe;
  --success:#10b981;
  --success-light:#d1fae5;
  --success-dark:#065f46;
  --danger:#ef4444;
  --danger-light:#fee2e2;
  --danger-dark:#991b1b;
  --gray-50:#f9fafb;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-300:#d1d5db;
  --gray-400:#9ca3af;
  --gray-500:#6b7280;
  --gray-600:#4b5563;
  --gray-700:#374151;
  --gray-800:#1f2937;
  --gray-900:#111827;
  --radius:10px;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eef2f7,#dfe8f5);
  min-height:100vh;
  padding:25px;
  color:var(--gray-800);
}

.container {
  max-width:1100px;
  margin:auto;
}

.header {
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.logo {
  width:50px;
  height:50px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  font-weight:bold;
}

.header h1 {
  font-size:25px;
  color:var(--gray-900);
}

.header p {
  color:var(--gray-500);
  font-size:14px;
  margin-top:3px;
}

.card {
  background:white;
  border-radius:14px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card-title {
  font-size:18px;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid var(--gray-200);
  color:var(--gray-900);
}

.form-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.form-group {
  display:flex;
  flex-direction:column;
}

label {
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
  color:var(--gray-700);
}

.required::after {
  content:" *";
  color:var(--danger);
}

input,
select {
  width:100%;
  padding:11px 13px;
  border:1px solid var(--gray-300);
  border-radius:7px;
  background:#fff;
  font-size:14px;
  outline:none;
}

input:focus,
select:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

select {
  cursor:pointer;
}

.loading-select {
  color:var(--gray-500);
}

.search-container {
  position:relative;
}

.search-icon {
  position:absolute;
  left:13px;
  top:36px;
  color:var(--gray-400);
}

#buscarMotivo {
  padding-left:38px;
}

.suggestions-list {
  display:none;
  position:absolute;
  top:68px;
  left:0;
  right:0;
  background:white;
  border:1px solid var(--gray-300);
  border-radius:7px;
  max-height:250px;
  overflow-y:auto;
  z-index:1000;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.suggestion-item {
  padding:11px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--gray-100);
  font-size:14px;
}

.suggestion-item:hover {
  background:var(--primary-light);
  color:var(--primary-dark);
}

.table-wrapper {
  overflow-x:auto;
  border:1px solid var(--gray-200);
  border-radius:8px;
}

table {
  width:100%;
  border-collapse:collapse;
}

th {
  background:var(--gray-800);
  color:white;
  padding:12px;
  font-size:13px;
  text-align:left;
}

td {
  padding:10px 12px;
  border-bottom:1px solid var(--gray-200);
  font-size:13px;
}

td input {
  padding:8px 10px;
}

.empty-state {
  text-align:center;
  color:var(--gray-500);
  padding:30px;
}

.btn-container {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn {
  border:none;
  padding:12px 20px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.btn-save {
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
}

.btn-save:hover {
  opacity:.92;
}

.btn-clear {
  background:white;
  border:1px solid var(--gray-300);
  color:var(--gray-700);
}

.btn-delete {
  background:var(--danger-light);
  color:var(--danger-dark);
  border:none;
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.btn-delete:hover {
  background:var(--danger);
  color:white;
}

.status {
  display:none;
  margin-top:16px;
  padding:12px 15px;
  border-radius:7px;
  font-size:14px;
}

.status-success {
  display:block;
  background:var(--success-light);
  color:var(--success-dark);
}

.status-error {
  display:block;
  background:var(--danger-light);
  color:var(--danger-dark);
}

.status-loading {
  display:block;
  background:var(--primary-light);
  color:var(--primary-dark);
}

.spinner {
  display:inline-block;
  width:15px;
  height:15px;
  border:2px solid rgba(37,99,235,.25);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:girar .8s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}

@keyframes girar {
  to { transform:rotate(360deg); }
}

.connection {
  font-size:12px;
  margin-top:8px;
}

.connection.ok {
  color:var(--success-dark);
}

.connection.error {
  color:var(--danger-dark);
}

@media(max-width:700px) {
  body {
    padding:12px;
  }

  .form-grid {
    grid-template-columns:1fr;
  }

  .card {
    padding:18px;
  }
}
</style>

</head>

<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

/*
   IMPORTANTE:

   Esta debe ser exactamente la URL /exec de tu Web App
   de Google Apps Script.

   NO colocar:
   h[https://
   [https://
   ni corchetes.
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz0drxHb69aZ2EiajQOM5ObodCUNKIDxsXuJL_a182JNUA2iIcXlgpPMX4iSrhfBegjuA/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let listaMotivosBase = [];

let motivosAgregados = [];

let cargandoDatos = false;


/* =========================================================
   JSONP
   ========================================================= */

function requestJSONP(action, params = {}) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_cb_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    let terminado = false;


    function limpiar() {

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }
    }


    const timeout =
      setTimeout(() => {

        if (terminado) return;

        terminado = true;

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado al conectar con Google Apps Script."
          )
        );

      }, 20000);


    window[callbackName] = function(data) {

      if (terminado) return;

      terminado = true;

      clearTimeout(timeout);

      limpiar();

      resolve(data);

    };


    let query =
      "action=" +
      encodeURIComponent(action) +
      "&callback=" +
      encodeURIComponent(callbackName);


    Object.keys(params).forEach(function(key) {

      query +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(params[key]);

    });


    const script =
      document.createElement("script");

    script.id = callbackName;

    script.src =
      API_URL + "?" + query;


    script.onerror = function() {

      if (terminado) return;

      terminado = true;

      clearTimeout(timeout);

      limpiar();

      reject(
        new Error(
          "No fue posible conectar con Google Apps Script."
        )
      );

    };


    document.body.appendChild(script);

  });

}


/* =========================================================
   INICIALIZACIÓN
   ========================================================= */

async function init() {

  if (cargandoDatos) return;

  cargandoDatos = true;

  actualizarConexion(
    "Conectando con Google Apps Script...",
    ""
  );


  try {

    console.log(
      "Conectando a:",
      API_URL
    );


    const respuesta =
      await requestJSONP(
        "getInitialData"
      );


    console.log(
      "Respuesta getInitialData:",
      respuesta
    );


    if (!respuesta) {

      throw new Error(
        "Google Apps Script no devolvió información."
      );

    }


    if (!respuesta.ok) {

      throw new Error(
        respuesta.error ||
        "Google Apps Script devolvió un error."
      );

    }


    /* FUNCIONARIOS */

    cargarFuncionarios(
      Array.isArray(respuesta.funcionarios)
        ? respuesta.funcionarios
        : []
    );


    /* MOTIVOS */

    cargarMotivos(
      Array.isArray(respuesta.motivos)
        ? respuesta.motivos
        : []
    );


    actualizarConexion(
      "✓ Conectado correctamente con Google Apps Script",
      "ok"
    );


    console.log(
      "Funcionarios cargados:",
      respuesta.funcionarios
    );


    console.log(
      "Motivos cargados:",
      respuesta.motivos
    );


  } catch (error) {

    console.error(
      "Error de conexión:",
      error
    );


    actualizarConexion(
      "✕ Error de conexión con Google Apps Script",
      "error"
    );


    mostrarMensaje(
      error.message,
      true
    );


    /* Mantener los controles utilizables */

    const funcionario =
      document.getElementById("funcionario");

    funcionario.innerHTML =
      '<option value="">No se pudieron cargar los funcionarios</option>';


  } finally {

    cargandoDatos = false;

  }


  renderizarTablaMotivos();

}


/* =========================================================
   CARGAR FUNCIONARIOS
   ========================================================= */

function cargarFuncionarios(funcionarios) {

  const select =
    document.getElementById("funcionario");


  select.innerHTML = "";


  const opcionInicial =
    document.createElement("option");

  opcionInicial.value = "";

  opcionInicial.textContent =
    "Seleccione funcionario...";

  select.appendChild(opcionInicial);


  if (
    !Array.isArray(funcionarios) ||
    funcionarios.length === 0
  ) {

    const opcion =
      document.createElement("option");

    opcion.value = "";

    opcion.textContent =
      "No hay funcionarios registrados";

    opcion.disabled = true;

    select.appendChild(opcion);

    return;
  }


  funcionarios.forEach(function(funcionario) {

    const nombre =
      String(funcionario || "").trim();

    if (!nombre) return;


    const opcion =
      document.createElement("option");

    opcion.value = nombre;

    opcion.textContent = nombre;

    select.appendChild(opcion);

  });

}


/* =========================================================
   CARGAR MOTIVOS
   ========================================================= */

function cargarMotivos(motivos) {

  listaMotivosBase = [];


  if (
    !Array.isArray(motivos)
  ) {
    return;
  }


  motivos.forEach(function(motivo) {

    const texto =
      String(motivo || "").trim();

    if (
      texto &&
      !listaMotivosBase.includes(texto)
    ) {

      listaMotivosBase.push(texto);

    }

  });

}


/* =========================================================
   BUSCADOR DE MOTIVOS
   ========================================================= */

const inputBuscar =
  document.getElementById(
    "buscarMotivo"
  );


const cajaSugerencias =
  document.getElementById(
    "listaSugerencias"
  );


inputBuscar.addEventListener(
  "input",
  function() {

    const texto =
      this.value
        .toLowerCase()
        .trim();


    cajaSugerencias.innerHTML = "";


    if (!texto) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    const filtrados =
      listaMotivosBase.filter(
        function(motivo) {

          return motivo
            .toLowerCase()
            .includes(texto);

        }
      );


    if (
      filtrados.length === 0
    ) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    filtrados.forEach(
      function(motivo) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "suggestion-item";


        div.textContent =
          motivo;


        div.onclick =
          function() {

            seleccionarMotivo(
              motivo
            );

          };


        cajaSugerencias.appendChild(
          div
        );

      }
    );


    cajaSugerencias.style.display =
      "block";

  }
);


/* =========================================================
   SELECCIONAR MOTIVO
   ========================================================= */

function seleccionarMotivo(motivo) {

  /*
     Evita agregar dos veces
     exactamente el mismo motivo.
  */

  const existe =
    motivosAgregados.some(
      function(item) {

        return item.motivo === motivo;

      }
    );


  if (existe) {

    mostrarMensaje(
      "Este motivo ya fue agregado.",
      true
    );

    inputBuscar.value = "";

    cajaSugerencias.style.display =
      "none";

    return;

  }


  motivosAgregados.push({

    motivo: motivo,

    observacion: ""

  });


  inputBuscar.value = "";

  cajaSugerencias.style.display =
    "none";


  renderizarTablaMotivos();

}


/* =========================================================
   RENDERIZAR TABLA
   ========================================================= */

function renderizarTablaMotivos() {

  const tbody =
    document.getElementById(
      "bodyMotivos"
    );


  tbody.innerHTML = "";


  if (
    motivosAgregados.length === 0
  ) {

    const tr =
      document.createElement("tr");


    const td =
      document.createElement("td");


    td.colSpan = 4;

    td.className =
      "empty-state";

    td.textContent =
      "No hay motivos agregados. Busque arriba para añadir uno.";


    tr.appendChild(td);

    tbody.appendChild(tr);

    return;

  }


  motivosAgregados.forEach(
    function(item, index) {

      const tr =
        document.createElement("tr");


      const tdNumero =
        document.createElement("td");

      tdNumero.textContent =
        index + 1;


      const tdMotivo =
        document.createElement("td");

      tdMotivo.textContent =
        item.motivo;


      const tdObservacion =
        document.createElement("td");


      const input =
        document.createElement("input");

      input.type = "text";

      input.placeholder =
        "Observación específica...";

      input.value =
        item.observacion || "";


      input.addEventListener(
        "input",
        function() {

          motivosAgregados[index]
            .observacion =
              this.value;

        }
      );


      tdObservacion.appendChild(
        input
      );


      const tdAccion =
        document.createElement("td");


      const boton =
        document.createElement("button");


      boton.className =
        "btn-delete";


      boton.textContent =
        "Quitar";


      boton.onclick =
        function() {

          eliminarMotivo(index);

        };


      tdAccion.appendChild(
        boton
      );


      tr.appendChild(tdNumero);

      tr.appendChild(tdMotivo);

      tr.appendChild(tdObservacion);

      tr.appendChild(tdAccion);


      tbody.appendChild(tr);

    }
  );

}


/* =========================================================
   ELIMINAR MOTIVO
   ========================================================= */

function eliminarMotivo(index) {

  motivosAgregados.splice(
    index,
    1
  );

  renderizarTablaMotivos();

}


/* =========================================================
   GUARDAR Y GENERAR PDF
   ========================================================= */

async function guardarYExportarPDF() {

  const funcionario =
    document.getElementById(
      "funcionario"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const documento =
    document.getElementById(
      "documento"
    ).value.trim();


  const ciudadano =
    document.getElementById(
      "ciudadano"
    ).value.trim().toUpperCase();


  if (!funcionario) {

    mostrarMensaje(
      "Debe seleccionar un funcionario.",
      true
    );

    return;

  }


  if (!documento) {

    mostrarMensaje(
      "Debe ingresar el documento.",
      true
    );

    return;

  }


  if (!ciudadano) {

    mostrarMensaje(
      "Debe ingresar el ciudadano.",
      true
    );

    return;

  }


  if (
    motivosAgregados.length === 0
  ) {

    mostrarMensaje(
      "Debe agregar por lo menos un motivo.",
      true
    );

    return;

  }


  const payload = {

    master: {

      funcionario:
        funcionario,

      placa:
        placa,

      documento:
        documento,

      ciudadano:
        ciudadano

    },

    detalles:
      motivosAgregados

  };


  mostrarMensaje(
    "Guardando devolución...",
    false,
    true
  );


  try {

    const respuestaGuardar =
      await requestJSONP(
        "guardarDevolucion",
        {
          data:
            JSON.stringify(payload)
        }
      );


    console.log(
      "Respuesta guardar:",
      respuestaGuardar
    );


    if (
      !respuestaGuardar ||
      !respuestaGuardar.ok
    ) {

      throw new Error(
        respuestaGuardar &&
        respuestaGuardar.error
          ? respuestaGuardar.error
          : "No se pudo guardar la devolución."
      );

    }


    const consecutivo =
      respuestaGuardar.id;


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada. Generando PDF...",
      false,
      true
    );


    const respuestaPDF =
      await requestJSONP(
        "generarPDF",
        {
          id:
            consecutivo
        }
      );


    console.log(
      "Respuesta PDF:",
      respuestaPDF
    );


    if (
      !respuestaPDF ||
      !respuestaPDF.ok ||
      !respuestaPDF.base64
    ) {

      throw new Error(
        respuestaPDF &&
        respuestaPDF.error
          ? respuestaPDF.error
          : "La devolución fue guardada, pero no se pudo generar el PDF."
      );

    }


    const enlace =
      document.createElement("a");


    enlace.href =
      "data:application/pdf;base64," +
      respuestaPDF.base64;


    enlace.download =
      respuestaPDF.filename ||
      ("Devolucion_" +
       consecutivo +
       ".pdf");


    document.body.appendChild(
      enlace
    );


    enlace.click();


    enlace.remove();


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada y PDF generado correctamente.",
      false
    );


  } catch (error) {

    console.error(
      "Error:",
      error
    );


    mostrarMensaje(
      error.message,
      true
    );

  }

}


/* =========================================================
   LIMPIAR
   ========================================================= */

function limpiarFormulario() {

  document.getElementById(
    "funcionario"
  ).value = "";


  document.getElementById(
    "placa"
  ).value = "";


  document.getElementById(
    "documento"
  ).value = "";


  document.getElementById(
    "ciudadano"
  ).value = "";


  document.getElementById(
    "buscarMotivo"
  ).value = "";


  motivosAgregados = [];


  cajaSugerencias.style.display =
    "none";


  renderizarTablaMotivos();


  ocultarMensaje();

}


/* =========================================================
   MENSAJES
   ========================================================= */

function mostrarMensaje(
  mensaje,
  error = false,
  loading = false
) {

  const box =
    document.getElementById(
      "mensajeStatus"
    );


  box.className =
    "status " +
    (
      loading
        ? "status-loading"
        : error
          ? "status-error"
          : "status-success"
    );


  box.innerHTML = "";


  if (loading) {

    const spinner =
      document.createElement(
        "span"
      );

    spinner.className =
      "spinner";

    box.appendChild(
      spinner
    );

  }


  const texto =
    document.createElement(
      "span"
    );

  texto.textContent =
    mensaje;


  box.appendChild(
    texto
  );


  box.style.display =
    "block";

}


function ocultarMensaje() {

  const box =
    document.getElementById(
      "mensajeStatus"
    );

  box.style.display =
    "none";

}


/* =========================================================
   ESTADO DE CONEXIÓN
   ========================================================= */

function actualizarConexion(
  texto,
  clase
) {

  const elemento =
    document.getElementById(
      "estadoConexion"
    );


  elemento.textContent =
    texto;


  elemento.className =
    "connection " +
    clase;

}


/* =========================================================
   CERRAR SUGERENCIAS
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".search-container"
      )
    ) {

      cajaSugerencias.style.display =
        "none";

    }

  }
);


/* =========================================================
   MAYÚSCULAS
   ========================================================= */

document
  .getElementById("placa")
  .addEventListener(
    "input",
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


document
  .getElementById("ciudadano")
  .addEventListener(
    "input",
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


/* =========================================================
   INICIAR
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    init();

  }
);

</script>
