<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Sistema Maestro-Detalle de Devoluciones - Secretaría de Movilidad">

  <title>DEVOLUCIÓN DE TRÁMITES</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f7;
      color: #222;
    }


    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .header {
      background: #ffffff;
      border-bottom: 4px solid #1b5e20;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }


    .logo {
      width: 65px;
      height: auto;
      object-fit: contain;
    }


    .titulo {
      color: #1b5e20;
      font-size: 23px;
      font-weight: bold;
    }


    .subtitulo {
      color: #555;
      font-size: 14px;
      margin-top: 4px;
    }


    /* =====================================================
       CONTENEDOR
       ===================================================== */

    .container {
      width: 95%;
      max-width: 1250px;
      margin: 25px auto;
    }


    /* =====================================================
       TARJETAS
       ===================================================== */

    .card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    }


    .card-title {
      font-size: 19px;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 10px;
    }


    /* =====================================================
       GRID
       ===================================================== */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }


    .campo {
      display: flex;
      flex-direction: column;
    }


    .campo.full {
      grid-column: 1 / -1;
    }


    label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
      font-size: 14px;
    }


    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 11px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }


    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1b5e20;
      box-shadow: 0 0 0 2px rgba(27, 94, 32, .12);
    }


    textarea {
      min-height: 100px;
      resize: vertical;
    }


    /* =====================================================
       BOTONES
       ===================================================== */

    .botones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }


    button {
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }


    button:hover {
      opacity: .9;
    }


    .btn-primary {
      background: #1b5e20;
      color: white;
    }


    .btn-primary:hover {
      background: #124416;
    }


    .btn-secondary {
      background: #757575;
      color: white;
    }


    .btn-secondary:hover {
      background: #555;
    }


    .btn-pdf {
      background: #1565c0;
      color: white;
    }


    .btn-pdf:hover {
      background: #0d47a1;
    }


    /* =====================================================
       DETALLES
       ===================================================== */

    .detalle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 15px;
    }


    .detalle {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }


    .detalle-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 2fr 1fr;
      gap: 12px;
      align-items: end;
    }


    .btn-eliminar {
      background: #c62828;
      color: white;
      width: 100%;
    }


    .btn-eliminar:hover {
      background: #8e1b1b;
    }


    /* =====================================================
       ESTADOS
       ===================================================== */

    .estado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-weight: bold;
    }


    .estado.ok {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }


    .estado.error {
      display: block;
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }


    .estado.info {
      display: block;
      background: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #90caf9;
    }


    /* =====================================================
       CARGANDO
       ===================================================== */

    .loading {
      display: none;
      text-align: center;
      padding: 15px;
      color: #1b5e20;
      font-weight: bold;
    }


    /* =====================================================
       PIE
       ===================================================== */

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 25px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 800px) {

      .grid {
        grid-template-columns: 1fr;
      }


      .campo.full {
        grid-column: auto;
      }


      .detalle-grid {
        grid-template-columns: 1fr;
      }


      .header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }


      .detalle-header {
        flex-direction: column;
        align-items: stretch;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="header">

    <div class="header-left">

      <img
        class="logo"
        src="logo.png"
        alt="Secretaría de Movilidad"
        onerror="this.style.display='none';">


      <div>

        <div class="titulo">
          SISTEMA MAESTRO - DETALLE DE DEVOLUCIONES
        </div>


        <div class="subtitulo">
          Secretaría de Movilidad - La Ceja del Tambo
        </div>

      </div>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <main class="container">


    <!-- ===================================================
         DATOS MAESTROS
         =================================================== -->

    <section class="card">

      <div class="card-title">
        Datos de la devolución
      </div>


      <div class="grid">


        <!-- FUNCIONARIO -->

        <div class="campo">

          <label for="funcionario">
            Funcionario
          </label>


          <select id="funcionario">

            <option value="">
              Cargando funcionarios...
            </option>

          </select>

        </div>



        <!-- PLACA -->

        <div class="campo">

          <label for="placa">
            Placa
          </label>


          <input
            type="text"
            id="placa"
            maxlength="10"
            placeholder="Ingrese la placa"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase();">

        </div>



        <!-- DOCUMENTO -->

        <div class="campo">

          <label for="documento">
            Documento
          </label>


          <input
            type="text"
            id="documento"
            placeholder="Número de documento"
            autocomplete="off">

        </div>



        <!-- CIUDADANO -->

        <div class="campo">

          <label for="ciudadano">
            Ciudadano
          </label>


          <input
            type="text"
            id="ciudadano"
            placeholder="Nombre del ciudadano"
            autocomplete="off">

        </div>



        <!-- OBSERVACIÓN -->

        <div class="campo full">

          <label for="observacion">
            Observación
          </label>


          <textarea
            id="observacion"
            placeholder="Observación general de la devolución"></textarea>

        </div>


      </div>

    </section>



    <!-- ===================================================
         DETALLES
         =================================================== -->

    <section class="card">


      <div class="detalle-header">


        <div
          class="card-title"
          style="margin:0; border:0; padding:0;">

          Detalle de la devolución

        </div>



        <button
          type="button"
          class="btn-primary"
          onclick="agregarDetalle()">

          + Agregar detalle

        </button>


      </div>



      <div id="contenedorDetalles">

        <!-- Los detalles se crean mediante JavaScript -->

      </div>


    </section>



    <!-- ===================================================
         BOTONES
         =================================================== -->

    <section class="card">


      <div class="botones">


        <button
          type="button"
          class="btn-primary"
          onclick="guardarDevolucion()">

          Guardar devolución

        </button>



        <button
          type="button"
          class="btn-secondary"
          onclick="limpiarFormulario()">

          Limpiar

        </button>



        <button
          type="button"
          class="btn-pdf"
          onclick="generarPDF()">

          Generar PDF

        </button>


      </div>



      <div
        id="loading"
        class="loading">

        Procesando solicitud...

      </div>



      <div
        id="estado"
        class="estado">

      </div>


    </section>


  </main>



  <!-- =====================================================
       PIE DE PÁGINA
       ===================================================== -->

  <footer class="footer">

    Secretaría de Movilidad - La Ceja del Tambo

    <br>

    Sistema de gestión de devoluciones

  </footer>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxajhVb5rD2oFHn7ZtNfhkU75Q1JDrejIttwiwOwu_dffL1bfoX7F66wQb-dJr0GwtOeQ/exec";


    let listaMotivos = [];

    let contadorDetalles = 0;



    /* =====================================================
       INICIO
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        console.log(
          "Sistema iniciado."
        );


        cargarDatosIniciales();

      }
    );



    /* =====================================================
       LLAMADA A GOOGLE APPS SCRIPT
       MEDIANTE JSONP
       ===================================================== */

    function llamarAPI(
      action,
      parametros = {}
    ) {

      return new Promise(
        function (resolve, reject) {


          const callback =
            "callback_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 1000000
            );


          const script =
            document.createElement(
              "script"
            );


          let finalizado = false;



          /* -----------------------------------------------
             TIEMPO MÁXIMO DE ESPERA
             ----------------------------------------------- */

          const temporizador =
            setTimeout(
              function () {


                if (finalizado) {
                  return;
                }


                finalizado = true;


                delete window[
                  callback
                ];


                if (
                  script.parentNode
                ) {

                  script.parentNode
                    .removeChild(
                      script
                    );

                }


                reject(
                  new Error(
                    "Tiempo de espera agotado al conectar con Google Apps Script."
                  )
                );


              },
              20000
            );



          /* -----------------------------------------------
             CALLBACK
             ----------------------------------------------- */

          window[
            callback
          ] =
            function (data) {


              if (finalizado) {
                return;
              }


              finalizado = true;


              clearTimeout(
                temporizador
              );


              delete window[
                callback
              ];


              if (
                script.parentNode
              ) {

                script.parentNode
                  .removeChild(
                    script
                  );

              }


              console.log(
                "Respuesta de Apps Script:",
                data
              );


              resolve(
                data
              );


            };



          /* -----------------------------------------------
             URL
             ----------------------------------------------- */

          const url =
            new URL(
              API_URL
            );


          url.searchParams.set(
            "action",
            action
          );


          url.searchParams.set(
            "callback",
            callback
          );



          Object.keys(
            parametros
          ).forEach(
            function (key) {


              url.searchParams.set(
                key,
                parametros[key]
              );


            }
          );



          console.log(
            "Consultando:",
            url.toString()
          );



          script.src =
            url.toString();



          /* -----------------------------------------------
             ERROR
             ----------------------------------------------- */

          script.onerror =
            function () {


              if (finalizado) {
                return;
              }


              finalizado = true;


              clearTimeout(
                temporizador
              );


              delete window[
                callback
              ];


              if (
                script.parentNode
              ) {

                script.parentNode
                  .removeChild(
                    script
                  );

              }


              reject(
                new Error(
                  "No fue posible conectar con Google Apps Script."
                )
              );


            };



          document.body.appendChild(
            script
          );


        }
      );

    }



    /* =====================================================
       CARGAR DATOS INICIALES
       ===================================================== */

    async function cargarDatosIniciales() {


      mostrarEstado(
        "Cargando funcionarios y motivos...",
        "info"
      );


      try {


        console.log(
          "Solicitando getInitialData..."
        );


        const resultado =
          await llamarAPI(
            "getInitialData"
          );


        console.log(
          "Resultado getInitialData:",
          resultado
        );



        if (!resultado) {

          throw new Error(
            "Google Apps Script no devolvió información."
          );

        }



        if (
          resultado.ok !== true
        ) {

          throw new Error(
            resultado.error ||
            "Google Apps Script devolvió un error."
          );

        }



        /* -----------------------------------------------
           FUNCIONARIOS
           ----------------------------------------------- */

        cargarFuncionarios(
          Array.isArray(
            resultado.funcionarios
          )
            ? resultado.funcionarios
            : []
        );



        /* -----------------------------------------------
           MOTIVOS
           ----------------------------------------------- */

        cargarMotivos(
          Array.isArray(
            resultado.motivos
          )
            ? resultado.motivos
            : []
        );



        /* -----------------------------------------------
           CREAR PRIMER DETALLE
           DESPUÉS DE CARGAR MOTIVOS
           ----------------------------------------------- */

        agregarDetalle();



        /* -----------------------------------------------
           MENSAJE
           ----------------------------------------------- */

        const cantidadFuncionarios =
          Array.isArray(
            resultado.funcionarios
          )
            ? resultado.funcionarios.length
            : 0;


        const cantidadMotivos =
          Array.isArray(
            resultado.motivos
          )
            ? resultado.motivos.length
            : 0;


        console.log(
          "Funcionarios:",
          cantidadFuncionarios
        );


        console.log(
          "Motivos:",
          cantidadMotivos
        );



        if (
          cantidadFuncionarios === 0 &&
          cantidadMotivos === 0
        ) {

          mostrarEstado(
            "La conexión funciona, pero no se recibieron funcionarios ni motivos.",
            "error"
          );

        }
        else {

          mostrarEstado(
            "Información cargada correctamente.",
            "ok"
          );


          setTimeout(
            ocultarEstado,
            3000
          );

        }


      }
      catch (error) {


        console.error(
          "ERROR CARGANDO DATOS:",
          error
        );


        mostrarEstado(
          "Error al cargar información: " +
          error.message,
          "error"
        );


      }

    }



    /* =====================================================
       FUNCIONARIOS
       ===================================================== */

    function cargarFuncionarios(
      lista
    ) {


      const select =
        document.getElementById(
          "funcionario"
        );


      if (!select) {

        console.error(
          "No existe #funcionario"
        );

        return;

      }



      select.innerHTML =
        "";



      const opcionInicial =
        document.createElement(
          "option"
        );


      opcionInicial.value =
        "";


      opcionInicial.textContent =
        lista.length > 0
          ? "Seleccione funcionario"
          : "No hay funcionarios";


      select.appendChild(
        opcionInicial
      );



      lista.forEach(
        function (funcionario) {


          if (
            funcionario === null ||
            funcionario === undefined
          ) {

            return;

          }


          const texto =
            String(
              funcionario
            ).trim();


          if (!texto) {

            return;

          }



          const option =
            document.createElement(
              "option"
            );


          option.value =
            texto;


          option.textContent =
            texto;


          select.appendChild(
            option
          );


        }
      );



      console.log(
        "Funcionarios cargados:",
        lista.length
      );


    }



    /* =====================================================
       MOTIVOS
       ===================================================== */

    function cargarMotivos(
      lista
    ) {


      listaMotivos =
        Array.isArray(lista)
          ? lista
          : [];



      console.log(
        "Motivos cargados:",
        listaMotivos
      );


    }



    /* =====================================================
       AGREGAR DETALLE
       ===================================================== */

    function agregarDetalle() {


      contadorDetalles++;


      const contenedor =
        document.getElementById(
          "contenedorDetalles"
        );


      if (!contenedor) {

        console.error(
          "No existe #contenedorDetalles"
        );

        return;

      }



      const div =
        document.createElement(
          "div"
        );


      div.className =
        "detalle";


      div.id =
        "detalle_" +
        contadorDetalles;



      /* -----------------------------------------------
         OPCIONES DE MOTIVOS
         ----------------------------------------------- */

      let opciones =
        '<option value="">Seleccione motivo</option>';



      listaMotivos.forEach(
        function (motivo) {


          if (
            motivo === null ||
            motivo === undefined
          ) {

            return;

          }


          const texto =
            String(
              motivo
            ).trim();


          if (!texto) {

            return;

          }



          opciones +=
            '<option value="' +
            escapeHtml(
              texto
            ) +
            '">' +
            escapeHtml(
              texto
            ) +
            '</option>';


        }
      );



      /* -----------------------------------------------
         HTML DEL DETALLE
         ----------------------------------------------- */

      div.innerHTML = `

        <div class="detalle-grid">


          <div class="campo">

            <label>
              No.
            </label>


            <input
              type="text"
              class="numero-detalle"
              value="${contadorDetalles}"
              readonly>

          </div>



          <div class="campo">

            <label>
              Motivo
            </label>


            <select class="motivo">

              ${opciones}

            </select>

          </div>



          <div class="campo">

            <label>
              Observación
            </label>


            <input
              type="text"
              class="detalleObservacion"
              placeholder="Detalle de la devolución">

          </div>



          <div class="campo">

            <label>
              Acción
            </label>


            <button
              type="button"
              class="btn-eliminar"
              onclick="eliminarDetalle('detalle_${contadorDetalles}')">

              Eliminar

            </button>

          </div>


        </div>

      `;



      contenedor.appendChild(
        div
      );


      reordenarNumerosDetalle();


      console.log(
        "Detalle agregado:",
        contadorDetalles
      );


    }



    /* =====================================================
       ELIMINAR DETALLE Y REORDENAR
       ===================================================== */

    function eliminarDetalle(
      idElemento
    ) {


      const elemento =
        document.getElementById(
          idElemento
        );


      if (elemento) {

        elemento.remove();

        reordenarNumerosDetalle();

      }


    }


    function reordenarNumerosDetalle() {

      const inputs =
        document.querySelectorAll(
          "#contenedorDetalles .numero-detalle"
        );


      inputs.forEach(
        function (input, index) {

          input.value = index + 1;

        }
      );

    }



    /* =====================================================
       OBTENER DETALLES
       ===================================================== */

    function obtenerDetalles() {


      const elementos =
        document.querySelectorAll(
          "#contenedorDetalles .detalle"
        );


      const detalles =
        [];


      elementos.forEach(
        function (elemento) {


          const motivo =
            elemento
              .querySelector(
                ".motivo"
              )
              .value;


          const observacion =
            elemento
              .querySelector(
                ".detalleObservacion"
              )
              .value
              .trim();



          if (
            motivo ||
            observacion
          ) {


            detalles.push({

              motivo:
                motivo,

              observacion:
                observacion

            });


          }


        }
      );


      return detalles;

    }



    /* =====================================================
       GUARDAR DEVOLUCIÓN
       ===================================================== */

    async function guardarDevolucion() {


      try {


        const funcionario =
          document
            .getElementById(
              "funcionario"
            )
            .value
            .trim();


        const placa =
          document
            .getElementById(
              "placa"
            )
            .value
            .trim()
            .toUpperCase();


        const documento =
          document
            .getElementById(
              "documento"
            )
            .value
            .trim();


        const ciudadano =
          document
            .getElementById(
              "ciudadano"
            )
            .value
            .trim();


        const observacion =
          document
            .getElementById(
              "observacion"
            )
            .value
            .trim();


        const detalles =
          obtenerDetalles();



        /* VALIDACIONES */

        if (!funcionario) {

          throw new Error(
            "Debe seleccionar el funcionario."
          );

        }


        if (!documento) {

          throw new Error(
            "Debe ingresar el documento."
          );

        }


        if (!ciudadano) {

          throw new Error(
            "Debe ingresar el ciudadano."
          );

        }


        if (
          detalles.length === 0
        ) {

          throw new Error(
            "Debe agregar al menos un detalle."
          );

        }



        mostrarLoading(
          true
        );



        const resultado =
          await llamarAPI(
            "guardarDevolucion",
            {

              data:
                JSON.stringify({

                  master: {

                    funcionario:
                      funcionario,

                    placa:
                      placa,

                    documento:
                      documento,

                    ciudadano:
                      ciudadano,

                    observacion:
                      observacion

                  },


                  detalles:
                    detalles

                })

            }
          );



        if (
          !resultado.ok
        ) {

          throw new Error(
            resultado.error ||
            "No fue posible guardar."
          );

        }



        mostrarEstado(
          "Devolución guardada correctamente. Consecutivo: " +
          (
            resultado.id ||
            ""
          ),
          "ok"
        );


      }
      catch (error) {


        console.error(
          "ERROR GUARDANDO:",
          error
        );


        mostrarEstado(
          error.message,
          "error"
        );


      }
      finally {


        mostrarLoading(
          false
        );


      }

    }



    /* =====================================================
       GENERAR Y DESCARGAR PDF (CORREGIDO BASE64)
       ===================================================== */

    async function generarPDF() {


      const id =
        prompt(
          "Ingrese el consecutivo de la devolución:"
        );


      if (!id) {

        return;

      }



      try {


        mostrarLoading(
          true
        );


        const resultado =
          await llamarAPI(
            "generarPDF",
            {
              id: id
            }
          );



        if (
          !resultado.ok
        ) {

          throw new Error(
            resultado.error ||
            "No fue posible generar el PDF."
          );

        }



        /* DESCARGA MEDIANTE BASE64 DECORADO */

        if (resultado.base64) {

          const nombreArchivo =
            resultado.filename ||
            ("Devolucion_" + id + ".pdf");


          const enlaceDescarga =
            document.createElement("a");


          enlaceDescarga.href =
            "data:application/pdf;base64," +
            resultado.base64;


          enlaceDescarga.download =
            nombreArchivo;


          document.body.appendChild(
            enlaceDescarga
          );


          enlaceDescarga.click();


          document.body.removeChild(
            enlaceDescarga
          );


          mostrarEstado(
            "PDF descargado correctamente.",
            "ok"
          );

        } else {

          throw new Error(
            "El servidor no devolvió el archivo PDF en base64."
          );

        }


      }
      catch (error) {


        console.error(
          "ERROR PDF:",
          error
        );


        mostrarEstado(
          error.message,
          "error"
        );


      }
      finally {


        mostrarLoading(
          false
        );


      }

    }



    /* =====================================================
       LIMPIAR FORMULARIO
       ===================================================== */

    function limpiarFormulario() {


      document
        .getElementById(
          "funcionario"
        )
        .value =
        "";


      document
        .getElementById(
          "placa"
        )
        .value =
        "";


      document
        .getElementById(
          "documento"
        )
        .value =
        "";


      document
        .getElementById(
          "ciudadano"
        )
        .value =
        "";


      document
        .getElementById(
          "observacion"
        )
        .value =
        "";


      document
        .getElementById(
          "contenedorDetalles"
        )
        .innerHTML =
        "";


      contadorDetalles =
        0;


      agregarDetalle();


      ocultarEstado();

    }



    /* =====================================================
       MOSTRAR ESTADO
       ===================================================== */

    function mostrarEstado(
      mensaje,
      tipo
    ) {


      const estado =
        document.getElementById(
          "estado"
        );


      if (!estado) {
        return;
      }


      estado.textContent =
        mensaje;


      estado.className =
        "estado " +
        tipo;

    }



    /* =====================================================
       OCULTAR ESTADO
       ===================================================== */

    function ocultarEstado() {


      const estado =
        document.getElementById(
          "estado"
        );


      if (!estado) {
        return;
      }


      estado.className =
        "estado";


      estado.textContent =
        "";

    }



    /* =====================================================
       LOADING
       ===================================================== */

    function mostrarLoading(
      mostrar
    ) {


      const loading =
        document.getElementById(
          "loading"
        );


      if (!loading) {
        return;
      }


      loading.style.display =
        mostrar
          ? "block"
          : "none";

    }



    /* =====================================================
       ESCAPAR HTML
       ===================================================== */

    function escapeHtml(
      texto
    ) {


      return String(
        texto
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );


    }


  </script>
