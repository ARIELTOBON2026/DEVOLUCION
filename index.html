<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Maestro - Devoluciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;
      --success: #10b981;
      --success-light: #d1fae5;
      --success-dark: #065f46;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --danger-dark: #991b1b;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e4ecf7 100%);
      min-height: 100vh;
      padding: 24px;
      color: var(--gray-800);
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: var(--shadow-md);
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .page-header p {
      font-size: 14px;
      color: var(--gray-500);
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 1px solid var(--gray-100);
      transition: box-shadow 0.2s ease;
    }

    .card:hover { box-shadow: var(--shadow-lg); }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 2px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group { display: flex; flex-direction: column; }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .required::after {
      content: '*';
      color: var(--danger);
      margin-left: 2px;
    }

    input, select {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      background: var(--gray-50);
      color: var(--gray-900);
      transition: all 0.15s ease;
      outline: none;
    }

    input::placeholder { color: var(--gray-400); }

    input:focus, select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Buscador de motivos */
    .search-container {
      position: relative;
      margin-bottom: 16px;
    }

    .search-icon {
      position: absolute;
      top: 40px;
      left: 14px;
      color: var(--gray-400);
      pointer-events: none;
    }

    #buscarMotivo {
      padding-left: 40px;
    }

    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: var(--shadow-lg);
    }

    .suggestions-list::-webkit-scrollbar { width: 6px; }
    .suggestions-list::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: 3px;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--gray-50);
      transition: background 0.1s;
    }

    .suggestion-item:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    /* Tabla de Motivos */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      background: var(--gray-800);
      color: white;
      padding: 12px 14px;
      text-align: left;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }

    tbody tr:hover { background: var(--gray-50); }
    tbody tr:last-child td { border-bottom: none; }

    td input {
      background: white;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--gray-200);
    }

    td input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.1);
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--gray-500);
      font-size: 14px;
    }

    .empty-state svg {
      opacity: 0.4;
      margin-bottom: 8px;
    }

    /* Botones */
    .btn-container {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-save-pdf {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 2px 4px rgba(37,99,235,0.3);
    }

    .btn-save-pdf:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37,99,235,0.35);
    }

    .btn-save-pdf:active { transform: translateY(0); }

    .btn-clear {
      background: white;
      color: var(--gray-700);
      border: 1.5px solid var(--gray-200);
    }

    .btn-clear:hover {
      background: var(--gray-50);
      border-color: var(--gray-300);
    }

    .btn-delete {
      background: var(--danger-light);
      color: var(--danger-dark);
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    /* Mensajes de estado */
    .status-msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      display: none;
      font-size: 14px;
      align-items: center;
      gap: 10px;
      border-left: 4px solid;
    }

    .status-success {
      background: var(--success-light);
      color: var(--success-dark);
      border-left-color: var(--success);
    }

    .status-error {
      background: var(--danger-light);
      color: var(--danger-dark);
      border-left-color: var(--danger);
    }

    /* Loader */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">

    <div class="page-header">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 20 6"></polyline>
          <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path>
        </svg>
      </div>
      <div>
        <h1>Sistema Maestro</h1>
        <p>Gestión de devoluciones</p>
      </div>
    </div>

    <!-- DATOS DE LA DEVOLUCIÓN -->
    <div class="card">
      <h2 class="card-title">Datos de la devolución</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="funcionario" class="required">Funcionario</label>
          <select id="funcionario">
            <option value="">Cargando funcionarios...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="placa">Placa</label>
          <input type="text" id="placa" placeholder="Ej. ABC-123" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
          <label for="documento" class="required">Documento</label>
          <input type="text" id="documento" placeholder="Número de documento">
        </div>
        <div class="form-group">
          <label for="ciudadano" class="required">Ciudadano</label>
          <input type="text" id="ciudadano" placeholder="Nombre completo" style="text-transform: uppercase;">
        </div>
      </div>
    </div>

    <!-- DETALLE DE MOTIVOS -->
    <div class="card">
      <h2 class="card-title">Motivos de la devolución</h2>

      <div class="form-group search-container">
        <label for="buscarMotivo">Buscar y agregar motivo</label>
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="buscarMotivo" placeholder="Escriba para buscar un motivo..." autocomplete="off">
        <div id="listaSugerencias" class="suggestions-list"></div>
      </div>

      <div class="table-wrapper">
        <table id="tablaMotivos">
          <thead>
            <tr>
              <th style="width:50px;">#</th>
              <th>Motivo</th>
              <th>Observación del Motivo</th>
              <th style="width:100px;">Acción</th>
            </tr>
          </thead>
          <tbody id="bodyMotivos"></tbody>
        </table>
      </div>
    </div>

    <!-- BOTONERA -->
    <div class="card">
      <div class="btn-container">
        <button class="btn btn-save-pdf" onclick="guardarYExportarPDF()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Guardar y Exportar PDF
        </button>
        <button class="btn btn-clear" onclick="limpiarFormulario()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>
          </svg>
          Limpiar
        </button>
      </div>
      <div id="mensajeStatus" class="status-msg"></div>
    </div>

  </div>

  <script>
    const API_URL = "hhttps://script.google.com/macros/s/AKfycbz0drxHb69aZ2EiajQOM5ObodCUNKIDxsXuJL_a182JNUA2iIcXlgpPMX4iSrhfBegjuA/exec";

    let listaMotivosBase = [];
    let motivosAgregados = [];

    function requestJSONP(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.getElementById(callbackName)?.remove();
          resolve(data);
        };

        let query = `action=${encodeURIComponent(action)}&callback=${encodeURIComponent(callbackName)}`;
        for (let k in params) query += `&${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`;

        const script = document.createElement('script');
        script.src = `${API_URL}?${query}`;
        script.id = callbackName;
        script.onerror = () => reject(new Error("No fue posible conectar con Google Apps Script."));
        document.body.appendChild(script);
      });
    }

    async function init() {
      try {
        const res = await requestJSONP('getInitialData');
        if (res.ok) {
          const selectFunc = document.getElementById('funcionario');
          selectFunc.innerHTML = '<option value="">Seleccione funcionario...</option>';
          res.funcionarios.forEach(f => selectFunc.innerHTML += `<option value="${f}">${f}</option>`);
          listaMotivosBase = res.motivos || [];
        }
      } catch (e) {
        mostrarMensaje(e.message, true);
      }
      renderizarTablaMotivos();
    }

    const inputBuscar = document.getElementById('buscarMotivo');
    const cajaSugerencias = document.getElementById('listaSugerencias');

    inputBuscar.addEventListener('input', function() {
      const texto = this.value.toLowerCase().trim();
      cajaSugerencias.innerHTML = '';

      if (!texto) {
        cajaSugerencias.style.display = 'none';
        return;
      }

      const filtrados = listaMotivosBase.filter(m => m.toLowerCase().includes(texto));

      if (filtrados.length > 0) {
        filtrados.forEach(motivo => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.textContent = motivo;
          div.onclick = () => seleccionarMotivo(motivo);
          cajaSugerencias.appendChild(div);
        });
        cajaSugerencias.style.display = 'block';
      } else {
        cajaSugerencias.style.display = 'none';
      }
    });

    function seleccionarMotivo(motivo) {
      motivosAgregados.push({ motivo: motivo, observacion: '' });
      inputBuscar.value = '';
      cajaSugerencias.style.display = 'none';
      renderizarTablaMotivos();
    }

    function renderizarTablaMotivos() {
      const tbody = document.getElementById('bodyMotivos');
      tbody.innerHTML = '';

      if (motivosAgregados.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="4" class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div>No hay motivos agregados. Busque arriba para añadir uno.</div>
        </td>`;
        tbody.appendChild(tr);
        return;
      }

      motivosAgregados.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:var(--gray-500);font-weight:500;">${index + 1}</td>
          <td style="font-weight:500;color:var(--gray-800);">${item.motivo}</td>
          <td>
            <input type="text" value="${item.observacion}"
                   placeholder="Observación específica..."
                   onchange="motivosAgregados[${index}].observacion = this.value">
          </td>
          <td>
            <button class="btn-delete" onclick="eliminarMotivo(${index})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>
              </svg>
              Quitar
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function eliminarMotivo(index) {
      motivosAgregados.splice(index, 1);
      renderizarTablaMotivos();
    }

    async function guardarYExportarPDF() {
      const funcionario = document.getElementById('funcionario').value;
      const placa = document.getElementById('placa').value.trim();
      const documento = document.getElementById('documento').value.trim();
      const ciudadano = document.getElementById('ciudadano').value.trim();

      if (!funcionario || !documento || !ciudadano) {
        mostrarMensaje("Complete los campos obligatorios (Funcionario, Documento, Ciudadano).", true);
        return;
      }

      const payload = {
        master: { funcionario, placa, documento, ciudadano },
        detalles: motivosAgregados
      };

      mostrarMensaje("Guardando devolución...", false, true);

      try {
        const resGuardar = await requestJSONP('guardarDevolucion', { data: JSON.stringify(payload) });

        if (!resGuardar.ok) {
          throw new Error(resGuardar.error || "No se pudo guardar la devolución.");
        }

        const consecutivo = resGuardar.id;
        mostrarMensaje(`Guardado correcto (N° ${consecutivo}). Generando PDF, por favor espere...`, false, true);

        const resPDF = await requestJSONP('generarPDF', { id: consecutivo });

        if (resPDF.ok && resPDF.base64) {
          const link = document.createElement('a');
          link.href = 'data:application/pdf;base64,' + resPDF.base64;
          link.download = resPDF.filename || `Devolucion_${consecutivo}.pdf`;
          link.click();
          mostrarMensaje(`Devolución N° ${consecutivo} guardada y PDF descargado correctamente.`, false);
        } else {
          throw new Error(resPDF.error || "La devolución se guardó, pero falló la generación del PDF.");
        }

      } catch (e) {
        mostrarMensaje(e.message, true);
      }
    }

    function limpiarFormulario() {
      document.getElementById('funcionario').value = '';
      document.getElementById('placa').value = '';
      document.getElementById('documento').value = '';
      document.getElementById('ciudadano').value = '';
      motivosAgregados = [];
      renderizarTablaMotivos();
      ocultarMensaje();
    }

    function mostrarMensaje(msg, esError = false, loading = false) {
      const box = document.getElementById('mensajeStatus');
      box.innerHTML = (loading ? '<span class="spinner"></span>' : '') + `<span>${msg}</span>`;
      box.className = `status-msg ${esError ? 'status-error' : 'status-success'}`;
      box.style.display = 'flex';
    }

    function ocultarMensaje() {
      document.getElementById('mensajeStatus').style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) cajaSugerencias.style.display = 'none';
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
