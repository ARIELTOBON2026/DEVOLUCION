<script>

/*
===========================================================
 CONFIGURACIÓN API
===========================================================

IMPORTANTE:

Esta debe ser exactamente la URL /exec de tu Web App.

NO colocar:
hhttps://
ni corchetes
ni Markdown.

===========================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbz0drxHb69aZ2EiajQOM5ObodCUNKIDxsXuJL_a182JNUA2iIcXlgpPMX4iSrhfBegjuA/exec";


let listaMotivosBase = [];
let motivosAgregados = [];

let apiDisponible = false;


/*
===========================================================
 ELEMENTOS
===========================================================
*/

const inputBuscar =
  document.getElementById("buscarMotivo");

const cajaSugerencias =
  document.getElementById("listaSugerencias");

const selectFuncionario =
  document.getElementById("funcionario");

const btnGuardar =
  document.getElementById("btnGuardar");

const btnLimpiar =
  document.getElementById("btnLimpiar");


/*
===========================================================
 JSONP GET
===========================================================
*/

function requestJSONP(action, params = {}) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_cb_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    let terminado = false;


    const limpiar = () => {

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    };


    const timeout =
      setTimeout(() => {

        if (terminado) return;

        terminado = true;

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado al conectar con Google Apps Script."
          )
        );

      }, 30000);


    window[callbackName] = function(data) {

      if (terminado) return;

      terminado = true;

      clearTimeout(timeout);

      limpiar();

      resolve(data);

    };


    let query =
      "action=" +
      encodeURIComponent(action) +
      "&callback=" +
      encodeURIComponent(callbackName);


    Object.keys(params).forEach(function(key) {

      if (
        params[key] !== undefined &&
        params[key] !== null
      ) {

        query +=
          "&" +
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(params[key]);

      }

    });


    const script =
      document.createElement("script");

    script.id = callbackName;

    script.async = true;

    script.src =
      API_URL + "?" + query;


    script.onerror = function() {

      if (terminado) return;

      terminado = true;

      clearTimeout(timeout);

      limpiar();

      reject(
        new Error(
          "No fue posible conectar con Google Apps Script."
        )
      );

    };


    document.body.appendChild(script);

  });

}


/*
===========================================================
 POST
===========================================================

Se utiliza para guardar información.

Content-Type:
text/plain

Esto evita problemas de CORS/preflight con GitHub Pages.
===========================================================
*/

async function requestPOST(action, data) {

  const respuesta = await fetch(
    API_URL,
    {
      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        action: action,
        data: data
      })
    }
  );


  if (!respuesta.ok) {

    throw new Error(
      "Error HTTP " +
      respuesta.status +
      " al comunicarse con Google Apps Script."
    );

  }


  const texto =
    await respuesta.text();


  let resultado;

  try {

    resultado =
      JSON.parse(texto);

  } catch (e) {

    console.error(
      "Respuesta recibida:",
      texto
    );

    throw new Error(
      "Google Apps Script devolvió una respuesta no válida."
    );

  }


  return resultado;

}


/*
===========================================================
 INICIALIZACIÓN
===========================================================
*/

async function init() {

  renderizarTablaMotivos();

  mostrarMensaje(
    "Conectando con Google Apps Script...",
    false,
    true,
    true
  );


  try {

    const res =
      await requestJSONP(
        "getInitialData"
      );


    if (!res || !res.ok) {

      throw new Error(
        res && res.error
          ? res.error
          : "Google Apps Script devolvió un error."
      );

    }


    /*
    FUNCIONARIOS
    */

    selectFuncionario.innerHTML =
      '<option value="">Seleccione funcionario...</option>';


    if (
      Array.isArray(res.funcionarios)
    ) {

      res.funcionarios.forEach(
        function(funcionario) {

          const option =
            document.createElement("option");

          option.value =
            funcionario;

          option.textContent =
            funcionario;

          selectFuncionario.appendChild(
            option
          );

        }
      );

    }


    /*
    MOTIVOS
    */

    listaMotivosBase =
      Array.isArray(res.motivos)
        ? res.motivos
        : [];


    apiDisponible = true;


    actualizarConexion(
      true
    );


    ocultarMensaje();


    console.log(
      "API conectada correctamente."
    );

    console.log(
      "Funcionarios:",
      res.funcionarios
        ? res.funcionarios.length
        : 0
    );

    console.log(
      "Motivos:",
      listaMotivosBase.length
    );


  } catch (error) {

    apiDisponible = false;

    actualizarConexion(false);


    selectFuncionario.innerHTML =
      '<option value="">No se pudieron cargar los funcionarios</option>';


    mostrarMensaje(
      error.message ||
      "No fue posible conectar con Google Apps Script.",
      true
    );


    console.error(
      "Error API:",
      error
    );

  }

}


/*
===========================================================
 INDICADOR DE CONEXIÓN
===========================================================
*/

function actualizarConexion(online) {

  const dot =
    document.getElementById(
      "connectionDot"
    );

  const text =
    document.getElementById(
      "connectionText"
    );


  if (online) {

    dot.className =
      "connection-dot online";

    text.textContent =
      "Conectado";

  } else {

    dot.className =
      "connection-dot offline";

    text.textContent =
      "Sin conexión";

  }

}


/*
===========================================================
 BUSCADOR DE MOTIVOS
===========================================================
*/

inputBuscar.addEventListener(
  "input",
  function() {

    const texto =
      this.value
        .toLowerCase()
        .trim();


    cajaSugerencias.innerHTML =
      "";


    if (!texto) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    const filtrados =
      listaMotivosBase.filter(
        function(motivo) {

          return String(motivo)
            .toLowerCase()
            .includes(texto);

        }
      );


    if (filtrados.length === 0) {

      cajaSugerencias.style.display =
        "none";

      return;

    }


    filtrados
      .slice(0, 50)
      .forEach(
        function(motivo) {

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "suggestion-item";

          div.textContent =
            motivo;

          div.onclick =
            function() {

              seleccionarMotivo(
                motivo
              );

            };


          cajaSugerencias.appendChild(
            div
          );

        }
      );


    cajaSugerencias.style.display =
      "block";

  }
);


/*
===========================================================
 SELECCIONAR MOTIVO
===========================================================
*/

function seleccionarMotivo(motivo) {

  /*
  Evitar duplicados
  */

  const existe =
    motivosAgregados.some(
      function(item) {

        return (
          String(item.motivo)
            .toLowerCase()
            .trim() ===
          String(motivo)
            .toLowerCase()
            .trim()
        );

      }
    );


  if (existe) {

    mostrarMensaje(
      "Ese motivo ya fue agregado.",
      true
    );

    return;

  }


  motivosAgregados.push({

    motivo: motivo,

    observacion: ""

  });


  inputBuscar.value =
    "";

  cajaSugerencias.style.display =
    "none";


  renderizarTablaMotivos();

}


/*
===========================================================
 TABLA DE MOTIVOS
===========================================================
*/

function renderizarTablaMotivos() {

  const tbody =
    document.getElementById(
      "bodyMotivos"
    );


  tbody.innerHTML =
    "";


  if (
    motivosAgregados.length === 0
  ) {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `
      <td colspan="4" class="empty-state">

        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line
            x1="12"
            y1="8"
            x2="12"
            y2="12"
          ></line>
          <line
            x1="12"
            y1="16"
            x2="12.01"
            y2="16"
          ></line>
        </svg>

        <div>
          No hay motivos agregados.
          Busque arriba para añadir uno.
        </div>

      </td>
    `;


    tbody.appendChild(
      tr
    );

    return;

  }


  motivosAgregados.forEach(
    function(item, index) {

      const tr =
        document.createElement("tr");


      const tdNumero =
        document.createElement("td");

      tdNumero.style.color =
        "var(--gray-500)";

      tdNumero.style.fontWeight =
        "500";

      tdNumero.textContent =
        index + 1;


      const tdMotivo =
        document.createElement("td");

      tdMotivo.style.fontWeight =
        "500";

      tdMotivo.style.color =
        "var(--gray-800)";

      tdMotivo.textContent =
        item.motivo;


      const tdObservacion =
        document.createElement("td");


      const input =
        document.createElement("input");

      input.type =
        "text";

      input.placeholder =
        "Observación específica...";

      input.value =
        item.observacion || "";


      input.addEventListener(
        "input",
        function() {

          motivosAgregados[index]
            .observacion =
              this.value;

        }
      );


      tdObservacion.appendChild(
        input
      );


      const tdAccion =
        document.createElement("td");


      const boton =
        document.createElement(
          "button"
        );

      boton.type =
        "button";

      boton.className =
        "btn-delete";

      boton.innerHTML = `
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline
            points="3 6 5 6 21 6"
          ></polyline>

          <path
            d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"
          ></path>
        </svg>

        Quitar
      `;


      boton.onclick =
        function() {

          eliminarMotivo(
            index
          );

        };


      tdAccion.appendChild(
        boton
      );


      tr.appendChild(
        tdNumero
      );

      tr.appendChild(
        tdMotivo
      );

      tr.appendChild(
        tdObservacion
      );

      tr.appendChild(
        tdAccion
      );


      tbody.appendChild(
        tr
      );

    }
  );

}


/*
===========================================================
 ELIMINAR MOTIVO
===========================================================
*/

function eliminarMotivo(index) {

  motivosAgregados.splice(
    index,
    1
  );

  renderizarTablaMotivos();

}


/*
===========================================================
 GUARDAR Y GENERAR PDF
===========================================================
*/

async function guardarYExportarPDF() {

  if (!apiDisponible) {

    mostrarMensaje(
      "No hay conexión con Google Apps Script. Recargue la página e intente nuevamente.",
      true
    );

    return;

  }


  const funcionario =
    document.getElementById(
      "funcionario"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const documento =
    document.getElementById(
      "documento"
    ).value.trim();


  const ciudadano =
    document.getElementById(
      "ciudadano"
    ).value.trim().toUpperCase();


  /*
  VALIDACIONES
  */

  if (!funcionario) {

    mostrarMensaje(
      "Seleccione el funcionario.",
      true
    );

    document.getElementById(
      "funcionario"
    ).focus();

    return;

  }


  if (!documento) {

    mostrarMensaje(
      "Ingrese el número de documento.",
      true
    );

    document.getElementById(
      "documento"
    ).focus();

    return;

  }


  if (!ciudadano) {

    mostrarMensaje(
      "Ingrese el nombre del ciudadano.",
      true
    );

    document.getElementById(
      "ciudadano"
    ).focus();

    return;

  }


  if (
    motivosAgregados.length === 0
  ) {

    mostrarMensaje(
      "Debe agregar al menos un motivo de devolución.",
      true
    );

    inputBuscar.focus();

    return;

  }


  /*
  PAYLOAD
  */

  const payload = {

    master: {

      funcionario:
        funcionario,

      placa:
        placa,

      documento:
        documento,

      ciudadano:
        ciudadano

    },


    detalles:
      motivosAgregados.map(
        function(item) {

          return {

            motivo:
              String(
                item.motivo || ""
              ).trim(),

            observacion:
              String(
                item.observacion || ""
              ).trim()

          };

        }
      )

  };


  /*
  BLOQUEAR BOTÓN
  */

  btnGuardar.disabled =
    true;

  btnLimpiar.disabled =
    true;


  mostrarMensaje(
    "Guardando devolución...",
    false,
    true
  );


  try {

    /*
    =======================================================
    GUARDAR

    Se utiliza POST para evitar problemas con URL demasiado
    larga y para soportar muchas observaciones.
    =======================================================
    */

    const resGuardar =
      await requestPOST(
        "guardarDevolucion",
        JSON.stringify(
          payload
        )
      );


    if (
      !resGuardar ||
      !resGuardar.ok
    ) {

      throw new Error(
        resGuardar &&
        resGuardar.error
          ? resGuardar.error
          : "No se pudo guardar la devolución."
      );

    }


    const consecutivo =
      resGuardar.id;


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada. Generando PDF...",
      false,
      true
    );


    /*
    =======================================================
    GENERAR PDF
    =======================================================
    */

    const resPDF =
      await requestJSONP(
        "generarPDF",
        {
          id: consecutivo
        }
      );


    if (
      !resPDF ||
      !resPDF.ok ||
      !resPDF.base64
    ) {

      throw new Error(
        resPDF &&
        resPDF.error
          ? resPDF.error
          : "La devolución se guardó, pero no fue posible generar el PDF."
      );

    }


    /*
    =======================================================
    DESCARGAR PDF
    =======================================================
    */

    descargarPDF(
      resPDF.base64,
      resPDF.filename ||
      (
        "Devolucion_" +
        consecutivo +
        ".pdf"
      )
    );


    mostrarMensaje(
      "Devolución N° " +
      consecutivo +
      " guardada y PDF descargado correctamente.",
      false
    );


    /*
    LIMPIAR DESPUÉS DE GUARDAR
    */

    limpiarCampos();


  } catch (error) {

    console.error(
      "Error guardar/generar PDF:",
      error
    );


    mostrarMensaje(
      error.message ||
      "Ocurrió un error inesperado.",
      true
    );

  } finally {

    btnGuardar.disabled =
      false;

    btnLimpiar.disabled =
      false;

  }

}


/*
===========================================================
 DESCARGAR PDF
===========================================================
*/

function descargarPDF(
  base64,
  filename
) {

  const byteCharacters =
    atob(base64);


  const byteArrays = [];


  const sliceSize =
    1024;


  for (
    let offset = 0;
    offset < byteCharacters.length;
    offset += sliceSize
  ) {

    const slice =
      byteCharacters.slice(
        offset,
        offset + sliceSize
      );


    const byteNumbers =
      new Array(
        slice.length
      );


    for (
      let i = 0;
      i < slice.length;
      i++
    ) {

      byteNumbers[i] =
        slice.charCodeAt(i);

    }


    const byteArray =
      new Uint8Array(
        byteNumbers
      );


    byteArrays.push(
      byteArray
    );

  }


  const blob =
    new Blob(
      byteArrays,
      {
        type:
          "application/pdf"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    filename;

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}

 LIMPIAR FORMULARIO

  if (

  ) {

function mostrarMensaje(
  msg,
  esError = false,
  loading = false,
  info = false
) {

  const box =
    document.getElementById(
      "mensajeStatus"
    );


  box.innerHTML =
    "";


  if (loading) {

    const spinner =
      document.createElement(
        "span"
      );

    spinner.className =
      "spinner";

    box.appendChild(
      spinner
    );

  }


  const texto =
    document.createElement(
      "span"
    );

  texto.textContent =
    msg;


  box.appendChild(
    texto
  );


  box.className =
    "status-msg " +
    (
      esError
        ? "status-error"
        : info
          ? "status-info"
          : "status-success"
    );


  box.style.display =
    "flex";

}

  document.getElementById(
