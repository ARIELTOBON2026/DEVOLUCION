<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema Maestro-Detalle de Devoluciones - Secretaría de Movilidad La Ceja del Tambo">
  <title>DEVOLUCIÓN DE TRÁMITES</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #1f2937;
    }

    .header {
      background: #ffffff;
      border-bottom: 4px solid #1d4ed8;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 8px;
      background: #eef2ff;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      color: #123b6d;
    }

    .header p {
      margin: 4px 0 0;
      color: #667085;
      font-size: 14px;
    }

    .container {
      width: min(1180px, calc(100% - 28px));
      margin: 22px auto 40px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      padding: 20px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 18px;
      color: #123b6d;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 13px;
      color: #344054;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 11px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: end;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .primary {
      background: #1d4ed8;
      color: #fff;
    }

    .secondary {
      background: #475569;
      color: #fff;
    }

    .success {
      background: #15803d;
      color: #fff;
    }

    .danger {
      background: #b91c1c;
      color: #fff;
    }

    .light {
      background: #e2e8f0;
      color: #1e293b;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }

    .status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #334155;
    }

    .small-btn {
      padding: 7px 9px;
      font-size: 12px;
      margin-right: 4px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 15px;
    }

    @media (max-width: 760px) {
      .grid,
      .detail-row {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo" aria-hidden="true"></div>
  <div>
    <h1>DEVOLUCIÓN DE TRÁMITES</h1>
    <p>Secretaría de Movilidad - La Ceja del Tambo</p>
  </div>
</header>

<main class="container">

  <div id="status" class="status"></div>

  <section class="card">
    <h2>Datos de la devolución</h2>

    <div class="grid">

      <div class="field">
        <label for="funcionario">Funcionario *</label>
        <select id="funcionario">
          <option value="">Cargando funcionarios...</option>
        </select>
      </div>

      <div class="field">
        <label for="placa">Placa</label>
        <input id="placa" type="text" maxlength="10" autocomplete="off">
      </div>

      <div class="field">
        <label for="documento">Documento *</label>
        <input id="documento" type="text" inputmode="numeric" autocomplete="off">
      </div>

      <div class="field">
        <label for="ciudadano">Ciudadano *</label>
        <input id="ciudadano" type="text" autocomplete="off">
      </div>

      <div class="field full">
        <label for="observacion">Observación general</label>
        <textarea id="observacion"></textarea>
      </div>

    </div>
  </section>

  <section class="card">
    <h2>Detalle de la devolución</h2>

    <div id="detalles"></div>

    <div class="buttons">
      <button class="secondary" type="button" onclick="agregarDetalle()">
        + Agregar motivo
      </button>
    </div>
  </section>

  <section class="card">
    <h2>Acciones</h2>

    <div class="buttons">
      <button class="primary" id="btnGuardar" type="button" onclick="guardar()">
        Guardar devolución
      </button>

      <button class="light" type="button" onclick="limpiarFormulario()">
        Limpiar
      </button>

      <button class="secondary" type="button" onclick="cargarDatos()">
        Actualizar datos
      </button>
    </div>
  </section>

  <section class="card">
    <h2>Últimas devoluciones</h2>

    <div id="tablaDevoluciones" class="loading">
      Cargando devoluciones...
    </div>
  </section>

  <div class="footer">
    Sistema Maestro-Detalle de Devoluciones · Versión 3.1
  </div>

</main>

<script>
  /*
   * ==========================================================
   * CONFIGURACIÓN
   * ==========================================================
   */
  const API_URL = "https://script.google.com/macros/s/AKfycbz9PuOvNFwXN26pScsMmoWLutGOh1K8Gzhya_tXv8LYev7FOiE8qFYuE9BLWKwVFjZT7A/exec";

  let funcionarios = [];
  let motivos = [];
  let devoluciones = [];
  let contadorJsonp = 0;

  /*
   * ==========================================================
   * INICIO
   * ==========================================================
   */
  document.addEventListener("DOMContentLoaded", function () {
    cargarDatos();
  });

  /*
   * ==========================================================
   * MENSAJES
   * ==========================================================
   */
  function mostrarEstado(mensaje, tipo) {
    const box = document.getElementById("status");

    box.textContent = mensaje;
    box.className = "status show " + (tipo || "info");
  }

  function ocultarEstado() {
    const box = document.getElementById("status");
    box.className = "status";
    box.textContent = "";
  }

  /*
   * ==========================================================
   * JSONP
   *
   * Se utiliza JSONP para evitar problemas CORS entre
   * GitHub Pages y Google Apps Script.
   * ==========================================================
   */
  function llamarJSONP(action, parametros, timeoutMs) {
    return new Promise(function(resolve, reject) {

      const callbackName =
        "__devolucionCallback_" +
        Date.now() +
        "_" +
        (++contadorJsonp);

      const script = document.createElement("script");

      const query = new URLSearchParams();

      query.set("action", action);
      query.set("callback", callbackName);
      query.set("_", Date.now().toString());

      if (parametros) {
        Object.keys(parametros).forEach(function(key) {
          const valor = parametros[key];

          if (valor !== undefined && valor !== null) {
            query.set(key, String(valor));
          }
        });
      }

      let terminado = false;

      const timer = setTimeout(function() {
        finalizarError(
          new Error(
            "Tiempo de espera agotado al conectar con Google Apps Script."
          )
        );
      }, timeoutMs || 30000);

      function limpiar() {
        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      function finalizarError(error) {
        if (terminado) return;

        terminado = true;
        limpiar();
        reject(error);
      }

      window[callbackName] = function(respuesta) {
        if (terminado) return;

        terminado = true;
        limpiar();

        if (!respuesta) {
          reject(new Error("Apps Script devolvió una respuesta vacía."));
          return;
        }

        if (respuesta.ok === false) {
          reject(
            new Error(
              respuesta.error ||
              "Google Apps Script devolvió un error."
            )
          );
          return;
        }

        resolve(respuesta);
      };

      script.onerror = function() {
        finalizarError(
          new Error(
            "No fue posible cargar la respuesta JSONP de Apps Script."
          )
        );
      };

      script.src = API_URL + "?" + query.toString();

      document.head.appendChild(script);
    });
  }

  /*
   * ==========================================================
   * CARGAR DATOS
   * ==========================================================
   */
  async function cargarDatos() {
    mostrarEstado("Conectando con Google Apps Script...", "info");

    try {
      const respuesta = await llamarJSONP(
        "getInitialData",
        {},
        30000
      );

      funcionarios = Array.isArray(respuesta.funcionarios)
        ? respuesta.funcionarios
        : [];

      motivos = Array.isArray(respuesta.motivos)
        ? respuesta.motivos
        : [];

      devoluciones = Array.isArray(respuesta.devoluciones)
        ? respuesta.devoluciones
        : [];

      cargarFuncionarios();
      cargarTablaDevoluciones();

      if (document.getElementById("detalles").children.length === 0) {
        agregarDetalle();
      }

      mostrarEstado(
        respuesta.mensaje || "Datos cargados correctamente.",
        "ok"
      );

    } catch (error) {
      console.error(error);

      mostrarEstado(
        "ERROR: " +
        (error && error.message
          ? error.message
          : String(error)),
        "error"
      );

      document.getElementById("tablaDevoluciones").innerHTML =
        '<div class="status show error">' +
        'No fue posible cargar los datos desde Apps Script.' +
        '<br><small>Revise la implementación de la Web App y la URL API_URL.</small>' +
        '</div>';
    }
  }

  /*
   * ==========================================================
   * FUNCIONARIOS
   * ==========================================================
   */
  function cargarFuncionarios() {
    const select = document.getElementById("funcionario");

    select.innerHTML =
      '<option value="">Seleccione un funcionario</option>';

    funcionarios.forEach(function(nombre) {
      const option = document.createElement("option");

      option.value = nombre;
      option.textContent = nombre;

      select.appendChild(option);
    });
  }

  /*
   * ==========================================================
   * DETALLES
   * ==========================================================
   */
  function agregarDetalle(motivoInicial, observacionInicial) {
    const contenedor = document.getElementById("detalles");

    const fila = document.createElement("div");
    fila.className = "detail-row";

    const campoMotivo = document.createElement("div");
    campoMotivo.className = "field";

    const labelMotivo = document.createElement("label");
    labelMotivo.textContent = "Motivo *";

    const select = document.createElement("select");
    select.className = "detalle-motivo";

    const optionInicial = document.createElement("option");
    optionInicial.value = "";
    optionInicial.textContent = "Seleccione un motivo";
    select.appendChild(optionInicial);

    motivos.forEach(function(motivo) {
      const option = document.createElement("option");

      option.value = motivo;
      option.textContent = motivo;

      if (motivoInicial === motivo) {
        option.selected = true;
      }

      select.appendChild(option);
    });

    campoMotivo.appendChild(labelMotivo);
    campoMotivo.appendChild(select);

    const campoObs = document.createElement("div");
    campoObs.className = "field";

    const labelObs = document.createElement("label");
    labelObs.textContent = "Observación";

    const textarea = document.createElement("textarea");
    textarea.className = "detalle-observacion";
    textarea.value = observacionInicial || "";
    textarea.placeholder = "Observación del motivo";

    campoObs.appendChild(labelObs);
    campoObs.appendChild(textarea);

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "danger";
    boton.textContent = "Eliminar";

    boton.onclick = function() {
      fila.remove();
    };

    fila.appendChild(campoMotivo);
    fila.appendChild(campoObs);
    fila.appendChild(boton);

    contenedor.appendChild(fila);
  }

  /*
   * ==========================================================
   * OBTENER DETALLES DEL FORMULARIO
   * ==========================================================
   */
  function obtenerDetallesFormulario() {
    const filas = document.querySelectorAll(".detail-row");
    const detalles = [];

    filas.forEach(function(fila) {
      const motivo =
        fila.querySelector(".detalle-motivo").value.trim();

      const observacion =
        fila.querySelector(".detalle-observacion").value.trim();

      if (motivo) {
        detalles.push({
          motivo: motivo,
          observacion: observacion
        });
      }
    });

    return detalles;
  }

  /*
   * ==========================================================
   * GUARDAR
   * ==========================================================
   */
  async function guardar() {
    const funcionario =
      document.getElementById("funcionario").value.trim();

    const placa =
      document.getElementById("placa").value.trim().toUpperCase();

    const documento =
      document.getElementById("documento").value.trim();

    const ciudadano =
      document.getElementById("ciudadano").value.trim().toUpperCase();

    const observacion =
      document.getElementById("observacion").value.trim();

    const detalles =
      obtenerDetallesFormulario();

    if (!funcionario) {
      mostrarEstado("Debe seleccionar un funcionario.", "error");
      return;
    }

    if (!documento) {
      mostrarEstado("Debe ingresar el documento.", "error");
      return;
    }

    if (!ciudadano) {
      mostrarEstado("Debe ingresar el ciudadano.", "error");
      return;
    }

    if (detalles.length === 0) {
      mostrarEstado(
        "Debe registrar por lo menos un motivo de devolución.",
        "error"
      );
      return;
    }

    const payload = {
      master: {
        funcionario: funcionario,
        placa: placa,
        documento: documento,
        ciudadano: ciudadano,
        observacion: observacion
      },
      detalles: detalles
    };

    const boton = document.getElementById("btnGuardar");

    boton.disabled = true;
    mostrarEstado(
      "Guardando devolución en Google Sheets...",
      "info"
    );

    try {
      /*
       * Se usa GET + JSONP porque GitHub Pages no puede leer
       * directamente la respuesta de un POST de Apps Script
       * cuando el navegador aplica CORS.
       */
      const respuesta = await llamarJSONP(
        "guardarDevolucion",
        {
          data: JSON.stringify(payload)
        },
        60000
      );

      mostrarEstado(
        "Devolución guardada correctamente. Consecutivo: " +
        respuesta.id,
        "ok"
      );

      limpiarFormulario();
      await cargarDatos();

    } catch (error) {
      console.error(error);

      mostrarEstado(
        "Error al guardar: " +
        (error && error.message
          ? error.message
          : String(error)),
        "error"
      );

    } finally {
      boton.disabled = false;
    }
  }

  /*
   * ==========================================================
   * LIMPIAR
   * ==========================================================
   */
  function limpiarFormulario() {
    document.getElementById("funcionario").value = "";
    document.getElementById("placa").value = "";
    document.getElementById("documento").value = "";
    document.getElementById("ciudadano").value = "";
    document.getElementById("observacion").value = "";

    document.getElementById("detalles").innerHTML = "";

    agregarDetalle();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  /*
   * ==========================================================
   * TABLA
   * ==========================================================
   */
  function cargarTablaDevoluciones() {
    const contenedor =
      document.getElementById("tablaDevoluciones");

    if (!devoluciones.length) {
      contenedor.innerHTML =
        "<div class='loading'>No existen devoluciones registradas.</div>";
      return;
    }

    let html = "";

    html += '<div class="table-wrap">';
    html += "<table>";
    html += "<thead><tr>";
    html += "<th>No.</th>";
    html += "<th>Fecha</th>";
    html += "<th>Funcionario</th>";
    html += "<th>Placa</th>";
    html += "<th>Documento</th>";
    html += "<th>Ciudadano</th>";
    html += "<th>Acciones</th>";
    html += "</tr></thead>";
    html += "<tbody>";

    devoluciones.forEach(function(item) {
      const id = escaparHTML(item.consecutivo);
      const fecha = escaparHTML(item.fecha);
      const funcionario = escaparHTML(item.funcionario);
      const placa = escaparHTML(item.placa);
      const documento = escaparHTML(item.documento);
      const ciudadano = escaparHTML(item.ciudadano);

      html += "<tr>";
      html += "<td>" + id + "</td>";
      html += "<td>" + fecha + "</td>";
      html += "<td>" + funcionario + "</td>";
      html += "<td>" + placa + "</td>";
      html += "<td>" + documento + "</td>";
      html += "<td>" + ciudadano + "</td>";
      html += "<td>";
      html +=
        '<button class="small-btn secondary" type="button" ' +
        'onclick="verDetalle(\'' +
        escaparJS(item.consecutivo) +
        '\')">Detalle</button>';

      html +=
        '<button class="small-btn success" type="button" ' +
        'onclick="generarPDF(\'' +
        escaparJS(item.consecutivo) +
        '\')">PDF</button>';

      html += "</td>";
      html += "</tr>";
    });

    html += "</tbody></table></div>";

    contenedor.innerHTML = html;
  }

  /*
   * ==========================================================
   * DETALLE
   * ==========================================================
   */
  async function verDetalle(id) {
    mostrarEstado(
      "Consultando detalle de la devolución " + id + "...",
      "info"
    );

    try {
      const respuesta = await llamarJSONP(
        "getDetalleDevolucion",
        { id: id },
        30000
      );

      const detalles = respuesta.detalles || [];

      if (!detalles.length) {
        mostrarEstado(
          "La devolución " + id + " no tiene detalles.",
          "info"
        );
        return;
      }

      const texto = detalles.map(function(item, index) {
        return (
          (index + 1) +
          ". " +
          item.motivo +
          (item.observacion
            ? " — " + item.observacion
            : "")
        );
      }).join("\n");

      alert(
        "DETALLE DE DEVOLUCIÓN " +
        id +
        "\n\n" +
        texto
      );

      ocultarEstado();

    } catch (error) {
      mostrarEstado(
        "Error consultando detalle: " +
        (error && error.message
          ? error.message
          : String(error)),
        "error"
      );
    }
  }

  /*
   * ==========================================================
   * GENERAR PDF
   * ==========================================================
   */
  async function generarPDF(id) {
    mostrarEstado(
      "Generando PDF de la devolución " + id + "...",
      "info"
    );

    try {
      const respuesta = await llamarJSONP(
        "generarPDF",
        { id: id },
        120000
      );

      if (!respuesta.base64) {
        throw new Error(
          "Apps Script no devolvió el PDF."
        );
      }

      descargarBase64PDF(
        respuesta.base64,
        respuesta.filename || ("Devolucion_" + id + ".pdf")
      );

      mostrarEstado(
        "PDF generado correctamente.",
        "ok"
      );

    } catch (error) {
      console.error(error);

      mostrarEstado(
        "Error al generar PDF: " +
        (error && error.message
          ? error.message
          : String(error)),
        "error"
      );
    }
  }

  /*
   * ==========================================================
   * DESCARGAR PDF
   * ==========================================================
   */
  function descargarBase64PDF(base64, nombre) {
    const byteCharacters = atob(base64);
    const byteNumbers = new Array(byteCharacters.length);

    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }

    const byteArray =
      new Uint8Array(byteNumbers);

    const blob =
      new Blob(
        [byteArray],
        { type: "application/pdf" }
      );

    const url =
      URL.createObjectURL(blob);

    const enlace =
      document.createElement("a");

    enlace.href = url;
    enlace.download = nombre;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /*
   * ==========================================================
   * SEGURIDAD HTML
   * ==========================================================
   */
  function escaparHTML(valor) {
    return String(valor || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escaparJS(valor) {
    return String(valor || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, '\"')
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");
  }
</script>

</body>
</html>
