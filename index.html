<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVOLUCIÓN DE TRÁMITES</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { background: #1a237e; color: #fff; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 1.4rem; margin-bottom: 5px; }
    header p { font-size: 0.85rem; opacity: 0.8; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: #1a237e; border-bottom: 2px solid #e8eaf6; padding-bottom: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #555; }
    .form-group label .req { color: #d32f2f; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 9px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.9rem; transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #1a237e; }
    .invalid { border-color: #d32f2f !important; background-color: #ffebee !important; }
    .btn { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: opacity 0.2s; }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-secondary { background: #78909c; color: #fff; }
    .btn-danger { background: #c62828; color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
    .acciones { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 10px; border: 1px solid #ddd; font-size: 0.82rem; text-align: left; vertical-align: top; }
    th { background: #e8eaf6; font-weight: 600; }
    .estado-msg { padding: 12px; border-radius: 5px; margin-top: 15px; font-size: 0.85rem; display: none; }
    .estado-msg.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    .estado-msg.error { background: #ffebee; color: #c62828; display: block; }
    .estado-msg.info { background: #e3f2fd; color: #1565c0; display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: #1a237e; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabla-resultados { overflow-x: auto; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>DEVOLUCIÓN DE TRÁMITES</h1>
    <p>Secretaría de Movilidad - La Ceja del Tambo</p>
  </header>

  <div class="card">
    <h2>Datos de la devolución</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Funcionario <span class="req">*</span></label>
        <select id="selFuncionario"><option value="">Cargando...</option></select>
      </div>
      <div class="form-group">
        <label>Fecha <span class="req">*</span></label>
        <input type="date" id="inpFecha">
      </div>
      <div class="form-group full">
        <label>Placa <span class="req">*</span></label>
        <input type="text" id="inpPlaca" placeholder="ABC123" style="text-transform: uppercase;">
      </div>
      <div class="form-group">
        <label>Documento</label>
        <input type="text" id="inpDocumento" placeholder="C.C. / NIT">
      </div>
      <div class="form-group">
        <label>Ciudadano <span class="req">*</span></label>
        <input type="text" id="inpCiudadano" placeholder="Nombre completo">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Detalle de la devolución</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Motivo <span class="req">*</span></label>
        <input type="text" id="inpMotivo" list="dlMotivos" placeholder="Escriba para buscar motivo...">
        <datalist id="dlMotivos"></datalist>
      </div>
      <div class="form-group">
        <label>Observación</label>
        <input type="text" id="inpObservacionMotivo">
      </div>
    </div>
    <div class="acciones">
      <button class="btn btn-secondary btn-sm" onclick="agregarMotivo()">+ Agregar motivo</button>
    </div>
    <table>
      <thead><tr><th>N°</th><th>Motivo</th><th>Observación</th><th></th></tr></thead>
      <tbody id="tbodyDetalles"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Acciones</h2>
    <div class="acciones">
      <button class="btn btn-success" onclick="guardarDevolucion()">📄 Guardar y Generar PDF</button>
      <button class="btn btn-secondary" onclick="limpiarFormulario()">🧹 Limpiar</button>
    </div>
    <div id="msgEstado" class="estado-msg"></div>
  </div>

  <!-- ✅ NUEVA TARJETA: BÚSQUEDA POR PLACA -->
  <div class="card">
    <h2>🔍 Búsqueda de devoluciones por placa</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Placa a buscar</label>
        <input type="text" id="inpBuscarPlaca" placeholder="Ej: ABC123" style="text-transform: uppercase;">
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <div class="acciones" style="margin-top:0;">
          <button class="btn btn-success" onclick="buscarPorPlaca()">🔍 Buscar</button>
          <button class="btn btn-secondary" onclick="limpiarBusqueda()">🧹 Limpiar</button>
        </div>
      </div>
    </div>
    <div id="msgBusqueda" class="estado-msg"></div>
    <div id="contResultados" class="tabla-resultados" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>Consec.</th><th>Fecha</th><th>Placa</th><th>Ciudadano</th><th>Funcionario</th><th>Motivos</th><th>PDF</th>
          </tr>
        </thead>
        <tbody id="tbodyResultados"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ==========================================
// CONFIGURACIÓN
// ==========================================
const URL_BACKEND = "https://script.google.com/macros/s/AKfycbx0mIdv9c-w4FNT1ig6unYGV4kkS_T20Bepb_O7-c7YuC3ZaAKkezySDws59E43Iv9K4A/exec";

let listaFuncionarios = [];
let listaMotivos = [];
let detallesFormulario = [];
let resultadosBusqueda = [];

// ==========================================
// PETICIÓN AL BACKEND
// ==========================================
async function ejecutarPeticion(params) {
  const url = new URL(URL_BACKEND);
  params._nocache = Date.now();
  Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
  const response = await fetch(url.toString(), { method: "GET", redirect: "follow" });
  if (!response.ok) throw new Error("Error en el servidor: " + response.statusText);
  return await response.json();
}

// ==========================================
// CARGAR DATOS INICIALES
// ==========================================
function cargarDatosIniciales() {
  mostrarEstado("info", '<span class="spinner"></span> Conectando con el servidor...');
  ejecutarPeticion({ action: "getInitialData" })
    .then(data => {
      if (data && data.ok) {
        listaFuncionarios = data.funcionarios || [];
        listaMotivos = data.motivos || [];
        llenarSelectFuncionarios();
        llenarDatalistMotivos();
        mostrarEstado("ok", "✅ Conectado. Datos cargados correctamente.");
      } else {
        mostrarEstado("error", "❌ Error al cargar datos: " + (data.error || "Respuesta no válida"));
      }
    })
    .catch(err => {
      mostrarEstado("error", "❌ Error de conexión al servidor.");
      console.error(err);
    });
}

function llenarSelectFuncionarios() {
  const sel = document.getElementById("selFuncionario");
  sel.innerHTML = '<option value="">-- Seleccione --</option>';
  listaFuncionarios.forEach(f => {
    const opt = document.createElement("option");
    opt.value = f.nombre; opt.textContent = f.nombre;
    sel.appendChild(opt);
  });
}

function llenarDatalistMotivos() {
  const dl = document.getElementById("dlMotivos");
  dl.innerHTML = "";
  listaMotivos.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.motivo;
    dl.appendChild(opt);
  });
}

// ==========================================
// GESTIÓN DE MOTIVOS
// ==========================================
function agregarMotivo() {
  const motivo = document.getElementById("inpMotivo").value.trim();
  const obs = document.getElementById("inpObservacionMotivo").value.trim();
  if (!motivo) { mostrarEstado("error", "Seleccione o escriba un motivo."); return; }
  detallesFormulario.push({ motivo, observacion: obs });
  renderDetalles();
  document.getElementById("inpMotivo").value = "";
  document.getElementById("inpObservacionMotivo").value = "";
}

function renderDetalles() {
  const tbody = document.getElementById("tbodyDetalles");
  tbody.innerHTML = "";
  detallesFormulario.forEach((d, i) => {
    tbody.innerHTML += `<tr><td>${i+1}</td><td>${d.motivo}</td><td>${d.observacion}</td><td><button class="btn btn-danger btn-sm" onclick="quitarMotivo(${i})">X</button></td></tr>`;
  });
}

function quitarMotivo(i) { detallesFormulario.splice(i, 1); renderDetalles(); }

// ==========================================
// GUARDAR DEVOLUCIÓN
// ==========================================
function guardarDevolucion() {
  let valid = true;
  const camposReq = ['inpFecha', 'selFuncionario', 'inpPlaca', 'inpCiudadano'];
  camposReq.forEach(id => {
    const el = document.getElementById(id);
    if (!el.value.trim()) { el.classList.add('invalid'); valid = false; }
    else { el.classList.remove('invalid'); }
  });

  if (!valid) {
    mostrarEstado("error", "Por favor complete los campos obligatorios marcados en rojo.");
    return;
  }
  if (detallesFormulario.length === 0) {
    mostrarEstado("error", "Agregue al menos un motivo a la lista.");
    return;
  }

  const datos = {
    fecha: document.getElementById("inpFecha").value,
    funcionario: document.getElementById("selFuncionario").value,
    placa: document.getElementById("inpPlaca").value.trim().toUpperCase(),
    documento: document.getElementById("inpDocumento").value.trim(),
    ciudadano: document.getElementById("inpCiudadano").value.trim(),
    detalles: detallesFormulario
  };

  const botones = document.querySelectorAll('.acciones .btn');
  botones.forEach(btn => btn.disabled = true);

  mostrarEstado("info", '<span class="spinner"></span> Guardando y generando PDF oficial...');

  ejecutarPeticion({ action: "guardarDevolucion", datos: JSON.stringify(datos) })
    .then(res => {
      if (res.ok) {
        mostrarEstado("ok", "✅ Guardado exitosamente! Consecutivo: " + res.consecutivo + ". Descargando PDF...");

        const nombreArchivo = `Devolucion_${res.consecutivo}_${datos.placa}.pdf`;

        if (res.pdfBase64) {
          descargarPDFDesdeBase64(res.pdfBase64, nombreArchivo);
        } else if (res.pdfDownloadUrl) {
          descargarPDFDesdeURL(res.pdfDownloadUrl, nombreArchivo);
        }

        setTimeout(() => {
          limpiarFormulario();
          cargarDatosIniciales();
        }, 500);

      } else {
        mostrarEstado("error", "Error al guardar: " + res.error);
      }
    })
    .catch(err => {
      mostrarEstado("error", "Error de red al guardar los datos.");
      console.error(err);
    })
    .finally(() => {
      botones.forEach(btn => btn.disabled = false);
    });
}

// ==========================================
// DESCARGA DE PDF SIN CERRAR LA PÁGINA
// ==========================================
function descargarPDFDesdeBase64(base64, filename) {
  try {
    const byteCharacters = atob(base64);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/pdf' });

    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }, 1000);
  } catch (err) {
    console.error("Error descargando desde base64:", err);
  }
}

function descargarPDFDesdeURL(url, filename) {
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.target = "_self";
  a.rel = "noopener noreferrer";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    if (document.body.contains(a)) document.body.removeChild(a);
  }, 1000);
}

// ==========================================
// ✅ BÚSQUEDA POR PLACA
// ==========================================
function buscarPorPlaca() {
  const placa = document.getElementById("inpBuscarPlaca").value.trim().toUpperCase();
  if (!placa) {
    mostrarEstadoBusqueda("error", "❌ Ingrese una placa para buscar.");
    return;
  }

  mostrarEstadoBusqueda("info", '<span class="spinner"></span> Buscando devoluciones para la placa <b>' + placa + '</b>...');

  ejecutarPeticion({ action: "buscarPorPlaca", placa: placa })
    .then(res => {
      if (res.ok) {
        if (!res.resultados || res.resultados.length === 0) {
          mostrarEstadoBusqueda("error", "Sin resultados: no se encontraron devoluciones para la placa <b>" + placa + "</b>.");
          document.getElementById("contResultados").style.display = "none";
        } else {
          mostrarEstadoBusqueda("ok", "✅ Se encontraron " + res.resultados.length + " devolución(es) para la placa <b>" + placa + "</b>.");
          renderResultados(res.resultados);
        }
      } else {
        mostrarEstadoBusqueda("error", "❌ Error en la búsqueda: " + (res.error || ""));
      }
    })
    .catch(err => {
      mostrarEstadoBusqueda("error", "❌ Error de conexión al buscar.");
      console.error(err);
    });
}

function renderResultados(resultados) {
  resultadosBusqueda = resultados;
  const tbody = document.getElementById("tbodyResultados");
  tbody.innerHTML = "";

  resultados.forEach((r, i) => {
    const motivos = (r.detalles || []).map((d, j) =>
      (j + 1) + ". " + d.motivo + (d.observacion ? " <i>(" + d.observacion + ")</i>" : "")
    ).join("<br>");

    const botonPDF = r.pdfUrl
      ? '<button class="btn btn-secondary btn-sm" onclick="verPDFResultado(' + i + ')">📄 Ver</button>'
      : '—';

    tbody.innerHTML += `
      <tr>
        <td>${r.consecutivo}</td>
        <td>${r.fecha}</td>
        <td><b>${r.placa}</b></td>
        <td>${r.ciudadano}</td>
        <td>${r.funcionario}</td>
        <td>${motivos}</td>
        <td>${botonPDF}</td>
      </tr>`;
  });

  document.getElementById("contResultados").style.display = "block";
}

function verPDFResultado(i) {
  const r = resultadosBusqueda[i];
  if (r && r.pdfUrl) {
    // Abre el PDF en una pestaña nueva; la página actual permanece abierta
    window.open(r.pdfUrl, "_blank", "noopener,noreferrer");
  }
}

function limpiarBusqueda() {
  document.getElementById("inpBuscarPlaca").value = "";
  document.getElementById("tbodyResultados").innerHTML = "";
  document.getElementById("contResultados").style.display = "none";
  resultadosBusqueda = [];
  const el = document.getElementById("msgBusqueda");
  el.className = "estado-msg";
  el.innerHTML = "";
  document.getElementById("inpBuscarPlaca").focus();
}

function mostrarEstadoBusqueda(tipo, html) {
  const el = document.getElementById("msgBusqueda");
  el.className = "estado-msg " + tipo;
  el.innerHTML = html;
}

// ==========================================
// UTILIDADES DEL FORMULARIO
// ==========================================
function limpiarFormulario() {
  document.getElementById("inpFecha").value = new Date().toISOString().split("T")[0];
  document.getElementById("selFuncionario").value = "";
  document.getElementById("inpMotivo").value = "";
  document.getElementById("inpPlaca").value = "";
  document.getElementById("inpDocumento").value = "";
  document.getElementById("inpCiudadano").value = "";
  detallesFormulario = [];
  renderDetalles();
  document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
}

function mostrarEstado(tipo, html) {
  const el = document.getElementById("msgEstado");
  el.className = "estado-msg " + tipo;
  el.innerHTML = html;
}

// ==========================================
// INICIALIZACIÓN
// ==========================================
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("inpFecha").value = new Date().toISOString().split("T")[0];

  const camposReq = ['inpFecha', 'selFuncionario', 'inpPlaca', 'inpCiudadano'];
  camposReq.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => el.classList.remove('invalid'));
    el.addEventListener('change', () => el.classList.remove('invalid'));
  });

  // Buscar con tecla Enter en el campo de búsqueda
  document.getElementById("inpBuscarPlaca").addEventListener("keydown", function(ev) {
    if (ev.key === "Enter") buscarPorPlaca();
  });

  cargarDatosIniciales();
});
</script>
</body>
</html>
