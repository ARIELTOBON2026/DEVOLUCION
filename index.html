<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Sistema Maestro-Detalle de Devoluciones - Secretaría de Movilidad">

  <title>DEVOLUCIÓN DE TRÁMITES</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .header {
      background: #ffffff;
      border-bottom: 4px solid #1b5e20;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 65px;
      height: auto;
      object-fit: contain;
    }

    .titulo {
      color: #1b5e20;
      font-size: 23px;
      font-weight: bold;
    }

    .subtitulo {
      color: #555;
      font-size: 14px;
      margin-top: 4px;
    }

    .container {
      width: 95%;
      max-width: 1250px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    .card-title {
      font-size: 19px;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 11px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1b5e20;
      box-shadow: 0 0 0 2px rgba(27,94,32,.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .botones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .btn-primary {
      background: #1b5e20;
      color: white;
    }

    .btn-primary:hover {
      background: #124416;
    }

    .btn-secondary {
      background: #757575;
      color: white;
    }

    .btn-secondary:hover {
      background: #555;
    }

    .btn-danger {
      background: #c62828;
      color: white;
    }

    .btn-danger:hover {
      background: #8e1b1b;
    }

    .btn-pdf {
      background: #1565c0;
      color: white;
    }

    .btn-pdf:hover {
      background: #0d47a1;
    }

    .detalle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .detalle {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .detalle-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 2fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .btn-eliminar {
      background: #c62828;
      color: white;
      width: 100%;
    }

    .estado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-weight: bold;
    }

    .estado.ok {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }

    .estado.error {
      display: block;
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }

    .estado.info {
      display: block;
      background: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #90caf9;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 15px;
      color: #1b5e20;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 25px;
    }

    @media (max-width: 800px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .campo.full {
        grid-column: auto;
      }

      .detalle-grid {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="header">

    <div class="header-left">

      <!--
        Si tienes logo institucional,
        coloca logo.png en el mismo repositorio
      -->

      <img
        class="logo"
        src="logo.png"
        alt="Secretaría de Movilidad"
        onerror="this.style.display='none';">

      <div>

        <div class="titulo">
          SISTEMA MAESTRO - DETALLE DE DEVOLUCIONES
        </div>

        <div class="subtitulo">
          Secretaría de Movilidad - La Ceja del Tambo
        </div>

      </div>

    </div>

  </header>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="container">


    <!-- ===================================================
         DATOS MAESTROS
         =================================================== -->

    <section class="card">

      <div class="card-title">
        Datos de la devolución
      </div>

      <div class="grid">


        <!-- FUNCIONARIO -->

        <div class="campo">

          <label for="funcionario">
            Funcionario
          </label>

          <select id="funcionario">

            <option value="">
              Cargando funcionarios...
            </option>

          </select>

        </div>


        <!-- PLACA -->

        <div class="campo">

          <label for="placa">
            Placa
          </label>

          <input
            type="text"
            id="placa"
            maxlength="10"
            placeholder="Ingrese la placa"
            oninput="this.value=this.value.toUpperCase();">

        </div>


        <!-- DOCUMENTO -->

        <div class="campo">

          <label for="documento">
            Documento
          </label>

          <input
            type="text"
            id="documento"
            placeholder="Número de documento">

        </div>


        <!-- CIUDADANO -->

        <div class="campo">

          <label for="ciudadano">
            Ciudadano
          </label>

          <input
            type="text"
            id="ciudadano"
            placeholder="Nombre del ciudadano">

        </div>


        <!-- OBSERVACIÓN -->

        <div class="campo full">

          <label for="observacion">
            Observación
          </label>

          <textarea
            id="observacion"
            placeholder="Observación general de la devolución"></textarea>

        </div>


      </div>

    </section>



    <!-- ===================================================
         DETALLES
         =================================================== -->

    <section class="card">

      <div class="detalle-header">

        <div class="card-title"
             style="margin:0; border:0; padding:0;">
          Detalle de la devolución
        </div>

        <button
          type="button"
          class="btn-primary"
          onclick="agregarDetalle()">

          + Agregar detalle

        </button>

      </div>


      <div id="contenedorDetalles">

        <!-- Los detalles se agregan aquí -->

      </div>

    </section>



    <!-- ===================================================
         BOTONES
         =================================================== -->

    <section class="card">

      <div class="botones">

        <button
          type="button"
          class="btn-primary"
          onclick="guardarDevolucion()">

          Guardar devolución

        </button>


        <button
          type="button"
          class="btn-secondary"
          onclick="limpiarFormulario()">

          Limpiar

        </button>


        <button
          type="button"
          class="btn-pdf"
          onclick="generarPDF()">

          Generar PDF

        </button>

      </div>


      <div id="loading"
           class="loading">

        Procesando solicitud...

      </div>


      <div id="estado"
           class="estado">
      </div>

    </section>


  </main>


  <!-- =====================================================
       PIE DE PÁGINA
       ===================================================== -->

  <footer class="footer">

    Secretaría de Movilidad - La Ceja del Tambo

    <br>

    Sistema de gestión de devoluciones

  </footer>



<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

/*
 * IMPORTANTE:
 *
 * AQUÍ debes colocar la URL /exec de tu Google Apps Script.
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxzoWB9fbZiPNmFplnu9xMK3cJJMr0a4nMkbmEeyD1q2tIS57kSYpvj_doN7tEN8u5QtA/exec";


let contadorDetalles = 0;


/* =========================================================
   INICIO
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    cargarDatosIniciales();

    agregarDetalle();

  }
);


/* =========================================================
   JSONP
   ========================================================= */

function llamarAPI(action, parametros = {}) {

  return new Promise(function(resolve, reject) {

    const callback =
      "callback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    window[callback] = function(data) {

      try {

        resolve(data);

      } finally {

        delete window[callback];

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    };


    const script =
      document.createElement("script");


    const query =
      new URLSearchParams();


    query.append(
      "action",
      action
    );


    query.append(
      "callback",
      callback
    );


    Object.keys(parametros).forEach(
      function(key) {

        query.append(
          key,
          parametros[key]
        );

      }
    );


    script.src =
      API_URL +
      "?" +
      query.toString();


    script.onerror =
      function() {

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(
          new Error(
            "No fue posible conectar con Google Apps Script."
          )
        );

      };


    document.body.appendChild(script);

  });

}


/* =========================================================
   DATOS INICIALES
   ========================================================= */

async function cargarDatosIniciales() {

  mostrarEstado(
    "Cargando información...",
    "info"
  );


  try {

    const resultado =
      await llamarAPI(
        "getInitialData"
      );


    if (!resultado.ok) {

      throw new Error(
        resultado.error ||
        "No fue posible obtener los datos."
      );

    }


    cargarFuncionarios(
      resultado.funcionarios || []
    );


    cargarMotivos(
      resultado.motivos || []
    );


    ocultarEstado();


  } catch(error) {

    mostrarEstado(
      error.message,
      "error"
    );

  }

}


/* =========================================================
   FUNCIONARIOS
   ========================================================= */

function cargarFuncionarios(lista) {

  const select =
    document.getElementById(
      "funcionario"
    );


  select.innerHTML =
    '<option value="">Seleccione funcionario</option>';


  lista.forEach(
    function(funcionario) {

      const option =
        document.createElement("option");


      option.value =
        funcionario;


      option.textContent =
        funcionario;


      select.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   MOTIVOS
   ========================================================= */

let listaMotivos = [];


function cargarMotivos(lista) {

  listaMotivos =
    lista || [];

}


/* =========================================================
   AGREGAR DETALLE
   ========================================================= */

function agregarDetalle() {

  contadorDetalles++;


  const contenedor =
    document.getElementById(
      "contenedorDetalles"
    );


  const div =
    document.createElement("div");


  div.className =
    "detalle";


  div.id =
    "detalle_" +
    contadorDetalles;


  let opciones =
    '<option value="">Seleccione motivo</option>';


  listaMotivos.forEach(
    function(motivo) {

      opciones +=
        `<option value="${escapeHtml(motivo)}">
          ${escapeHtml(motivo)}
        </option>`;

    }
  );


  div.innerHTML = `

    <div class="detalle-grid">

      <div class="campo">

        <label>
          No.
        </label>

        <input
          type="text"
          value="${contadorDetalles}"
          readonly>

      </div>


      <div class="campo">

        <label>
          Motivo
        </label>

        <select class="motivo">

          ${opciones}

        </select>

      </div>


      <div class="campo">

        <label>
          Observación
        </label>

        <input
          type="text"
          class="detalleObservacion"
          placeholder="Detalle de la devolución">

      </div>


      <div class="campo">

        <label>
          Acción
        </label>

        <button
          type="button"
          class="btn-eliminar"
          onclick="eliminarDetalle(${contadorDetalles})">

          Eliminar

        </button>

      </div>

    </div>

  `;


  contenedor.appendChild(
    div
  );

}


/* =========================================================
   ELIMINAR DETALLE
   ========================================================= */

function eliminarDetalle(id) {

  const elemento =
    document.getElementById(
      "detalle_" + id
    );


  if (elemento) {

    elemento.remove();

  }

}


/* =========================================================
   OBTENER DETALLES
   ========================================================= */

function obtenerDetalles() {

  const elementos =
    document.querySelectorAll(
      "#contenedorDetalles .detalle"
    );


  const detalles = [];


  elementos.forEach(
    function(elemento) {

      const motivo =
        elemento
          .querySelector(".motivo")
          .value;


      const observacion =
        elemento
          .querySelector(".detalleObservacion")
          .value
          .trim();


      if (motivo || observacion) {

        detalles.push({

          motivo:
            motivo,

          observacion:
            observacion

        });

      }

    }
  );


  return detalles;

}


/* =========================================================
   GUARDAR DEVOLUCIÓN
   ========================================================= */

async function guardarDevolucion() {

  try {

    const funcionario =
      document
        .getElementById("funcionario")
        .value
        .trim();


    const placa =
      document
        .getElementById("placa")
        .value
        .trim()
        .toUpperCase();


    const documento =
      document
        .getElementById("documento")
        .value
        .trim();


    const ciudadano =
      document
        .getElementById("ciudadano")
        .value
        .trim();


    const observacion =
      document
        .getElementById("observacion")
        .value
        .trim();


    const detalles =
      obtenerDetalles();


    if (!funcionario) {

      throw new Error(
        "Debe seleccionar el funcionario."
      );

    }


    if (!documento) {

      throw new Error(
        "Debe ingresar el documento."
      );

    }


    if (!ciudadano) {

      throw new Error(
        "Debe ingresar el ciudadano."
      );

    }


    if (detalles.length === 0) {

      throw new Error(
        "Debe agregar al menos un detalle."
      );

    }


    const master = {

      funcionario:
        funcionario,

      placa:
        placa,

      documento:
        documento,

      ciudadano:
        ciudadano,

      observacion:
        observacion

    };


    mostrarLoading(true);


    const resultado =
      await llamarAPI(
        "guardarDevolucion",
        {

          data:
            JSON.stringify({

              master:
                master,

              detalles:
                detalles

            })

        }
      );


    if (!resultado.ok) {

      throw new Error(
        resultado.error ||
        "No fue posible guardar."
      );

    }


    mostrarEstado(
      "Devolución guardada correctamente. Consecutivo: " +
      (resultado.id || ""),
      "ok"
    );


  } catch(error) {

    mostrarEstado(
      error.message,
      "error"
    );

  } finally {

    mostrarLoading(false);

  }

}


/* =========================================================
   GENERAR PDF
   ========================================================= */

async function generarPDF() {

  const id =
    prompt(
      "Ingrese el consecutivo de la devolución:"
    );


  if (!id) {

    return;

  }


  try {

    mostrarLoading(true);


    const resultado =
      await llamarAPI(
        "generarPDF",
        {
          id: id
        }
      );


    if (!resultado.ok) {

      throw new Error(
        resultado.error ||
        "No fue posible generar el PDF."
      );

    }


    if (resultado.url) {

      window.open(
        resultado.url,
        "_blank"
      );

    }


    mostrarEstado(
      "PDF generado correctamente.",
      "ok"
    );


  } catch(error) {

    mostrarEstado(
      error.message,
      "error"
    );

  } finally {

    mostrarLoading(false);

  }

}


/* =========================================================
   LIMPIAR
   ========================================================= */

function limpiarFormulario() {

  document
    .getElementById("funcionario")
    .value = "";


  document
    .getElementById("placa")
    .value = "";


  document
    .getElementById("documento")
    .value = "";


  document
    .getElementById("ciudadano")
    .value = "";


  document
    .getElementById("observacion")
    .value = "";


  document
    .getElementById(
      "contenedorDetalles"
    )
    .innerHTML = "";


  contadorDetalles = 0;


  agregarDetalle();


  ocultarEstado();

}


/* =========================================================
   ESTADO
   ========================================================= */

function mostrarEstado(
  mensaje,
  tipo
) {

  const estado =
    document.getElementById(
      "estado"
    );


  estado.textContent =
    mensaje;


  estado.className =
    "estado " +
    tipo;

}


function ocultarEstado() {

  const estado =
    document.getElementById(
      "estado"
    );


  estado.className =
    "estado";


  estado.textContent =
    "";

}


/* =========================================================
   LOADING
   ========================================================= */

function mostrarLoading(
  mostrar
) {

  document
    .getElementById("loading")
    .style.display =
      mostrar
        ? "block"
        : "none";

}


/* =========================================================
   SEGURIDAD HTML
   ========================================================= */

function escapeHtml(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
